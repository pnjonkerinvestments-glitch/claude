<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Roviko short 9: Every lobby has these 5 players</title>
<!--
  Roviko short 9, "Every Roviko lobby has these 5 players". 20 s, 1080x1920, 120 BPM ("Life is a Dream", Mixkit).
  Five cards drop in, one per bar: the Googler, the Speed-Clicker, the "I knew that", the Silent Assassin and the
  Rage-Quitter, each with a tiny gag. Then "Which one are you? Tag your squad." and the numbers pulse for the comments.
-->
<style>
@font-face { font-family: 'Fredoka'; src: url(../roviko-launch-film/assets/fonts/fredoka-latin-wght-normal.woff2) format('woff2'); font-weight: 300 700; font-display: block; }
@font-face { font-family: 'Manrope'; src: url(../roviko-launch-film/assets/fonts/manrope-variable.woff2) format('woff2'); font-weight: 200 800; font-display: block; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow: hidden; background: #163B32; }
body { -webkit-font-smoothing: antialiased; font-family: Manrope, sans-serif; color: #163B32; }
#stage { position: absolute; left: 0; top: 0; overflow: hidden; }
.a { position: absolute; left: 0; top: 0; }
svg { overflow: visible; }
</style>
<script src="../roviko-launch-film/assets/mascot.js"></script>
<script src="../roviko-carousels/data/geo.js"></script>
<script src="data/special.js"></script>
</head>
<body>
<div id="stage"></div>
<script src="lib/core.js"></script>
<script src="lib/extras.js"></script>
<script>
const TEMPO = 119.998, DIL = TEMPO / 130, END = 40, DURATION = END * 60 / TEMPO;
const TL = { cards: [2, 7, 12, 17, 22], cap2: 27.5, end: 34, hop: 38, blink2: 36.4 };
setupStage(C.cream);
const world = el(stage, { width: 1080, height: 1920, zIndex: 1 });
const uiL = el(stage, { width: 1080, height: 1920, zIndex: 20 });
const capL = el(stage, { width: 1080, height: 1920, zIndex: 50 });
Halo(world, 540, 900, 1700);
const TYPES = [
  { p: { name: 'Emma', img: 1 }, title: 'The Googler', line: 'Suspiciously fast on the hard ones', gag: '📱', col: C.ocean },
  { p: { name: 'Lucas', img: 2 }, title: 'The Speed-Clicker', line: 'Answers in 0.2 seconds. Wrong.', gag: '⚡', col: C.red },
  { p: { name: 'Amara', img: 5 }, title: 'The “I knew that”', line: 'Says it after every single reveal', gag: '🙄', col: C.gold },
  { p: { name: 'Yuki', img: 3 }, title: 'The Silent Assassin', line: 'Hasn’t said a word. Leads by 3,000.', gag: '👑', col: C.forest },
  { p: { name: 'Mateo', img: 4 }, title: 'The Rage-Quitter', line: '“Mateo left the room”', gag: '🚪', col: '#7A8C99' },
];
const CARD = { x: 100, w: 820, h: 172, y0: 380, gap: 188 };
const cards = TYPES.map((ty, i) => {
  const e = el(uiL, { left: CARD.x, top: CARD.y0 + i * CARD.gap, width: CARD.w, height: CARD.h, borderRadius: 34, background: C.white, transformOrigin: '50% 50%',
    boxShadow: '0 2px 4px rgba(22,59,50,.06), 0 16px 36px rgba(22,59,50,.14)' });
  const num = el(e, { left: 22, top: 22, width: 52, height: 52, borderRadius: 26, background: ty.col, color: C.white, textAlign: 'center', lineHeight: '52px', fontFamily: 'Fredoka', fontWeight: 600, fontSize: 30, zIndex: 2 }, String(i + 1));
  const av = avatar(e, ty.p, 116, 0); S(av, { left: 50, top: 28, boxShadow: `0 0 0 5px ${ty.col}` });
  el(e, { left: 196, top: 26, fontFamily: 'Fredoka', fontWeight: 600, fontSize: 46, lineHeight: '58px', color: C.forest, whiteSpace: 'pre' }, ty.title);
  el(e, { left: 198, top: 92, width: 520, fontFamily: 'Manrope', fontWeight: 700, fontSize: 30, lineHeight: '38px', color: 'rgba(22,59,50,.7)' }, ty.line);
  const gag = el(e, { left: CARD.w - 110, top: 40, width: 90, height: 90, fontSize: 66, lineHeight: '90px', textAlign: 'center', transformOrigin: '50% 80%' }, ty.gag);
  return { e, num, gag };
});
const cap1 = Caption(capL, ['Every Roviko lobby has', 'these <b>5 players</b>'], { cy: 230, size: 60 });
const cap2 = Caption(capL, ['Which one are you? 👇', 'Tag your squad'], { cy: 230, size: 60 });
const endCard = EndCard(stage, { my: 690, tagline: 'Up to 12 friends. All 5 of these.' });

ev(0.02, 'pop', -12, { rate: 1.1 });
TL.cards.forEach((b, i) => { ev(b + 0.05, 'swoosh', -9, { rate: 1 + i * 0.05 }); ev(b + 0.8, ['notify', 'tap', 'pop', 'levelup', 'leave'][i], -7); });
ev(TL.cap2 + 0.1, 'mention', -6);
[0, 1, 2, 3, 4].forEach(i => ev(TL.cap2 + 1 + i * 0.5, 'pop', -12, { rate: 1 + i * 0.07 }));
ev(TL.end + 0.1, 'swoosh', -7); ev(TL.end + 0.35, 'sparkle', -7); ev(TL.end + 0.7, 'expand', -10);

function seek(tReal) {
  const t = clamp(tReal, 0, DURATION) * DIL, b = t / BEAT;
  HALOS[0].img.style.transform = `rotate(${20 + t * 14}deg)`;
  cards.forEach((c, i) => {
    const cb = TL.cards[i], p = spB(t, cb, 2.0, 0.64), q = segB(t, TL.end - 0.75 + i * 0.07, TL.end - 0.15 + i * 0.07, E.inBack);
    S(c.e, { transform: `translateX(${(1 - clamp(p)) * (i % 2 ? 300 : -300)}px) scale(${lerp(0.4, 1, clamp(p, 0, 1.1)) * (1 - q)}) rotate(${(1 - clamp(p)) * (i % 2 ? 6 : -6)}deg)` });
    show(c.e, p > 0.001 && q < 1);
    // each gag: phone peeks, lightning shakes, eye-roll bob, crown sparkle, door slam
    const d = t - T(cb + 0.8);
    let gt = `scale(${spB(t, cb + 0.7, 2.8, 0.5)})`;
    if (d > 0) {
      if (i === 0) gt += ` translateY(${Math.sin(d * 6) * 6}px)`;
      if (i === 1) gt += ` rotate(${Math.sin(d * 40) * 10 * Math.exp(-d * 2)}deg)`;
      if (i === 2) gt += ` rotate(${Math.sin(d * 5) * 14}deg)`;
      if (i === 3) gt += ` translateY(${bop(b, 10)}px)`;
      if (i === 4) gt += ` scaleX(${1 - 0.3 * Math.exp(-d * 6) * Math.abs(Math.sin(d * 20))})`;
    }
    S(c.gag, { transform: gt });
    const pulse = b > TL.cap2 + 1 + i * 0.5 ? Math.exp(-(t - T(TL.cap2 + 1 + i * 0.5)) * 6) : 0;
    S(c.num, { transform: `scale(${1 + 0.5 * pulse})` });
  });
  cap1.set(spB(t, -1.5, 1.9, 0.62), segB(t, TL.cap2 - 0.2, TL.cap2 + 0.15));
  cap2.set(spB(t, TL.cap2, 1.9, 0.62), segB(t, TL.end - 0.05, TL.end + 0.2));
  endCard.update(t, TL.end, [540, 1300], { hops: [TL.hop], blinks: [TL.blink2] });
}

boot(seek, DURATION);
</script>
</body>
</html>
