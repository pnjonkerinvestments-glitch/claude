<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Roviko short 10: The UK explained</title>
<!--
  Roviko short 10, "England, Britain, the UK... explained in 10 seconds". 15 s, 1080x1920, 120 BPM ("Funkee Monkeee", Mixkit).
  Bubbles pop in: Scotland, England, Wales; a frame wraps them: Great Britain (the island). Northern Ireland joins and a
  bigger frame wraps all four: the United Kingdom. Ireland pops up outside: its own country. Roviko's head spins.
  "Got it? No? Same." "Now explain Holland vs the Netherlands."
-->
<style>
@font-face { font-family: 'Fredoka'; src: url(../roviko-launch-film/assets/fonts/fredoka-latin-wght-normal.woff2) format('woff2'); font-weight: 300 700; font-display: block; }
@font-face { font-family: 'Manrope'; src: url(../roviko-launch-film/assets/fonts/manrope-variable.woff2) format('woff2'); font-weight: 200 800; font-display: block; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow: hidden; background: #163B32; }
body { -webkit-font-smoothing: antialiased; font-family: Manrope, sans-serif; color: #163B32; }
#stage { position: absolute; left: 0; top: 0; overflow: hidden; }
.a { position: absolute; left: 0; top: 0; }
svg { overflow: visible; }
</style>
<script src="../roviko-launch-film/assets/mascot.js"></script>
<script src="../roviko-carousels/data/geo.js"></script>
<script src="data/special.js"></script>
</head>
<body>
<div id="stage"></div>
<script src="lib/core.js"></script>
<script src="lib/extras.js"></script>
<script>
const TEMPO = 120.384, DIL = TEMPO / 130, END = 30, DURATION = END * 60 / TEMPO;
const TL = { bub: [1.5, 2.3, 3.1], gb: 5.2, ni: 8.2, uk: 10.2, ie: 13.2, spin: 15.6, say: 17.6, cap2: 20.4, end: 24, hop: 28, blink2: 26.6 };
setupStage(C.cream);
const world = el(stage, { width: 1080, height: 1920, zIndex: 1 });
const uiL = el(stage, { width: 1080, height: 1920, zIndex: 20 });
const capL = el(stage, { width: 1080, height: 1920, zIndex: 50 });
Halo(world, 540, 900, 1700);
const BUB = [
  { name: 'Scotland', x: 560, y: 520, r: 104, bg: C.ocean, fg: C.ink },
  { name: 'England', x: 640, y: 790, r: 118, bg: C.green, fg: C.white },
  { name: 'Wales', x: 420, y: 760, r: 92, bg: C.gold, fg: C.forest },
  { name: 'Northern\nIreland', x: 250, y: 520, r: 98, bg: C.red, fg: C.white },
  { name: 'Ireland', x: 260, y: 1220, r: 108, bg: '#2E9E5B', fg: C.white },
];
const bubs = BUB.map(o => el(uiL, { left: o.x - o.r, top: o.y - o.r, width: 2 * o.r, height: 2 * o.r, borderRadius: '50%', background: o.bg, color: o.fg, zIndex: 22,
  display: 'grid', placeItems: 'center', textAlign: 'center', fontFamily: 'Fredoka', fontWeight: 600, fontSize: o.r > 100 ? 36 : 30, lineHeight: '1.05', whiteSpace: 'pre', transformOrigin: '50% 50%',
  boxShadow: '0 12px 28px rgba(22,59,50,.18)' }, `<div class="a" style="width:100%;height:100%;display:grid;place-items:center">${o.name}</div>`));
function Frame(x, y, w, h, label, col, labelY) {
  const f = el(uiL, { left: x, top: y, width: w, height: h, borderRadius: 60, border: `6px dashed ${col}`, background: 'rgba(255,255,255,.35)', zIndex: 21, transformOrigin: '50% 50%' });
  const l = Tag(uiL, label, { bg: col, fg: C.white, font: 'Fredoka', weight: 600, size: 36, h: 72, ls: '0', z: 23 });
  S(l, { left: x + 30, top: labelY });
  return { f, l };
}
const gb = Frame(290, 390, 520, 560, 'Great Britain (the island)', C.forest, 940);
const uk = Frame(120, 330, 740, 720, 'United Kingdom', C.ink, 1020);
const ieTag = Tag(uiL, 'A separate country!', { bg: C.white, fg: '#2E9E5B', font: 'Fredoka', weight: 600, size: 36, h: 72, ls: '0', z: 23 });
const MX = 790, MY = 1300, MR = 100;
const mBox = el(uiL, { left: MX - MR * 1.7, top: MY - MR * 1.7, width: MR * 3.4, height: MR * 3.4, zIndex: 30 });
const mascot = Mascot(mBox, MR * 3.4); S(mascot.svg, { left: 0, top: 0 });
const say = Bubble(uiL, 'Got it? No?<br>Same. 😵‍💫', { x: 390, y: 1090, w: 330, size: 42, tail: 'right', tx: 290 });
const cap1 = Caption(capL, ['England, Britain, the UK…', 'explained in <b>10 seconds</b>'], { cy: 230, size: 58 });
const cap2 = Caption(capL, ['Now explain <b>Holland</b> vs', 'the <b>Netherlands</b> 👇'], { cy: 230, size: 58 });
const endCard = EndCard(stage, { my: 690, tagline: 'Geography, finally explained.' });

ev(0.02, 'pop', -12, { rate: 1.1 });
TL.bub.forEach((b, i) => ev(b + 0.04, 'pop', -8, { rate: 0.95 + i * 0.08 }));
ev(TL.gb + 0.1, 'expand', -7); ev(TL.ni + 0.04, 'pop', -7, { rate: 1.2 }); ev(TL.uk + 0.1, 'expand', -6, { rate: 0.9 });
ev(TL.ie + 0.04, 'boing', -7); ev(TL.ie + 0.6, 'pop', -10);
ev(TL.spin + 0.2, 'swoosh', -8);
ev(TL.say + 0.1, 'mention', -7);
ev(TL.cap2 + 0.1, 'mention', -7);
ev(TL.end + 0.1, 'swoosh', -7); ev(TL.end + 0.35, 'sparkle', -7); ev(TL.end + 0.7, 'expand', -10);

function seek(tReal) {
  const t = clamp(tReal, 0, DURATION) * DIL, b = t / BEAT;
  HALOS[0].img.style.transform = `rotate(${20 + t * 14}deg)`;
  const pops = [TL.bub[0], TL.bub[1], TL.bub[2], TL.ni, TL.ie];
  bubs.forEach((e, i) => { const p = spB(t, pops[i], 2.6, 0.55); S(e, { transform: `scale(${p}) translateY(${bop(b, 4, i * 0.2)}px)` }); show(e, p > 0.001); });
  [[gb, TL.gb], [uk, TL.uk]].forEach(([fr, fb]) => {
    const p = spB(t, fb, 2.0, 0.66); S(fr.f, { transform: `scale(${lerp(0.6, 1, clamp(p, 0, 1.1))})` }); show(fr.f, p > 0.001);
    const lp = spB(t, fb + 0.3, 2.6, 0.55); S(fr.l, { transform: `scale(${lp}) rotate(${-2 * lp}deg)` }); show(fr.l, lp > 0.001);
  });
  const ip = spB(t, TL.ie + 0.5, 2.6, 0.55); S(ieTag, { left: 120, top: 1356, transform: `scale(${ip}) rotate(${-3 * ip}deg)` }); show(ieTag, ip > 0.001);
  // Roviko: following along, then his eyes spin
  const spinning = b >= TL.spin && b < TL.say + 1;
  const ang = (b - TL.spin) * 4.2;
  drawMascot(mascot, { look: spinning ? [Math.cos(ang), Math.sin(ang)] : b < TL.ie ? [-0.8, -0.8] : [-0.9, 0.2], eyesBig: spinning ? 0.4 : 0, mouth: spinning ? 'wobble' : b >= TL.say ? 'grin' : 'smile',
    sweat: spinning ? 1 : 0, tilt: spinning ? Math.sin(ang) * 8 : 0, cheeks: b >= TL.say ? 0.7 : 0, legs: 1, hop: b < TL.spin || b > TL.say ? bop(b, 6) : 0,
    arms: spinning ? [[-60, -60, -30, 11], [60, -60, -30, 11]] : [[-112, 66, 22, 10], [112, 66, 22, 10]], blink: blinkAt(t, [4.2, 12.1]) });
  say.set(spB(t, TL.say, 2.2, 0.6), segB(t, TL.cap2 - 0.2, TL.cap2 + 0.1));
  cap1.set(spB(t, -1.5, 1.9, 0.62), segB(t, TL.cap2 - 0.2, TL.cap2 + 0.15));
  cap2.set(spB(t, TL.cap2, 1.9, 0.62), segB(t, TL.end - 0.05, TL.end + 0.2));
  endCard.update(t, TL.end, [MX, MY], { hops: [TL.hop], blinks: [TL.blink2] });
}

boot(seek, DURATION);
</script>
</body>
</html>
