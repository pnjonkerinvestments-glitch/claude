<!--

  title, one white card, Roviko, "Play today's trip"). 1080x1920. banner.html?id=15-funny (ids in BANNERS below).
  Rendered to PNG by build/banner-png.mjs.
-->
<style>
@font-face { font-family: 'Fredoka'; src: url(../roviko-launch-film/assets/fonts/fredoka-latin-wght-normal.woff2) format('woff2'); font-weight: 300 700; font-display: block; }
@font-face { font-family: 'Manrope'; src: url(../roviko-launch-film/assets/fonts/manrope-variable.woff2) format('woff2'); font-weight: 200 800; font-display: block; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow: hidden; background: #F6F3E9; }
body { -webkit-font-smoothing: antialiased; font-family: Manrope, sans-serif; color: #163B32; }
#stage { position: absolute; left: 0; top: 0; overflow: hidden; }
.a { position: absolute; left: 0; top: 0; }
svg { overflow: visible; }
</style>
<script src="../roviko-launch-film/assets/mascot.js"></script>
<script src="../roviko-carousels/data/geo.js"></script>
<script src="data/special.js"></script>
</head>
<body>
<div id="stage"></div>
<script src="lib/core.js"></script>
<script src="lib/extras.js"></script>
<script>
const id = Q.get('id') || '15-funny';
setupStage(C.cream);
S(stage, { background: `radial-gradient(900px 700px at 85% 8%, rgba(31,128,107,.08), transparent 70%), radial-gradient(1000px 900px at 20% 70%, rgba(31,128,107,.07), transparent 70%), ${C.cream}` });
const X0 = 120, CW = 840, CX = X0, CY = 860;            // content column and the card's default top
const FR = n => `<span style="font-family:Fredoka;font-weight:600">${n}</span>`;

// ------------------------------------------------------------------ frame
function header(day) {
  el(stage, { left: X0, top: 360, height: 60, display: 'flex', alignItems: 'center', gap: '16px', zIndex: 10 },
    `<img src="${ASSETS}roviko-globe.svg" style="width:52px;height:52px;display:block"><span style="font-family:Fredoka;font-weight:600;font-size:44px;color:${C.forest}">roviko</span>`);
  const b = el(stage, { top: 366, height: 50, padding: '0 22px', borderRadius: 25, background: C.white, boxShadow: '0 2px 8px rgba(22,59,50,.08)', zIndex: 10,
    lineHeight: '50px', fontWeight: 700, fontSize: 24, color: C.forest, whiteSpace: 'pre' }, `Day ${day}`);
  LAYOUT.push(() => S(b, { left: 1080 - X0 - b.getBoundingClientRect().width }));
}
function title(eyebrow, l1, l2) {
  el(stage, { left: X0, top: 486, fontWeight: 800, fontSize: 27, letterSpacing: '0.14em', color: C.green, zIndex: 10, whiteSpace: 'pre' }, eyebrow.toUpperCase());
  const t = el(stage, { left: X0, top: 528, zIndex: 10, fontFamily: 'Fredoka', fontWeight: 600, fontSize: 84, lineHeight: '94px', letterSpacing: '-0.01em', whiteSpace: 'pre', transformOrigin: '0 0' },
    `<div style="color:${C.forest}">${l1}</div><div style="color:${C.green}">${l2}</div>`);
  LAYOUT.push(() => { const w = t.getBoundingClientRect().width; if (w > 1080 - 2 * X0) S(t, { transform: `scale(${(1080 - 2 * X0) / w})` }); });
}
function cta() {
  const p = el(stage, { top: 1736, height: 104, padding: '0 58px', borderRadius: 52, background: C.forest, color: C.white, zIndex: 40, lineHeight: '104px',
    fontFamily: 'Fredoka', fontWeight: 600, fontSize: 42, whiteSpace: 'pre', boxShadow: '0 10px 30px rgba(22,59,50,.22)' }, 'Play today’s trip  →');
  LAYOUT.push(() => S(p, { left: 540 - p.getBoundingClientRect().width / 2 }));
}
const wcard = (x, y, w, h, z = 5, css = {}) => el(stage, Object.assign({ left: x, top: y, width: w, height: h, borderRadius: 32, background: C.white, zIndex: z,
  boxShadow: '0 2px 6px rgba(22,59,50,.05), 0 18px 50px rgba(22,59,50,.10)', overflow: 'hidden' }, css));
// Roviko with his globe centred at (x, y), globe diameter d
const POSES = {
  wave: { mouth: 'smile', cheeks: 0.5, legs: 1, arms: [[-112, 66, 22, 10], [118, -86, -18, 10]] },
  cheer: { happy: 1, mouth: 'grin', cheeks: 0.9, legs: 1, arms: [[-118, -92, -22, 11], [118, -92, -22, 11]] },
  wink: { wink: 1, mouth: 'grin', cheeks: 0.8, legs: 1, arms: [[-112, 66, 22, 10], [100, -40, -20, 10]] },
  shock: { mouth: 'o', eyesBig: 0.6, brows: 'up', legs: 1, arms: [[-70, -96, -30, 11], [70, -96, -30, 11]] },
  nervous: { look: [0.6, -0.6], mouth: 'wobble', brows: 'worried', sweat: 1, eyesBig: 0.3, legs: 1, arms: [[-108, 58, 24, 10], [104, 62, 22, 10]] },
  cool: { mouth: 'smile', brow: 1, shades: { on: 1, drop: 0 }, legs: 1, arms: [[-90, 40, 30, 10], [90, 40, -30, 10]] },
  think: { look: [-0.7, -0.7], mouth: 'flat', brow: 1, legs: 1, arms: [[-112, 66, 22, 10], [40, 30, -40, 10]] },
  palm: { look: [0, 0.4], blink: 1, mouth: 'flat', brows: 'worried', legs: 1, arms: [[-112, 66, 22, 10], [26, -14, -30, 12]] },
  tired: { blink: 0.55, mouth: 'wobble', brows: 'worried', sweat: 1, legs: 1, arms: [[-104, 64, 22, 10], [104, 64, -22, 10]] },
};
function roviko(x, y, d, pose, z = 30) {
  const px = d * 340 / 200, box = el(stage, { left: x - px / 2, top: y - px / 2, width: px, height: px, zIndex: z });
  const m = Mascot(box, px); S(m.svg, { left: 0, top: 0 }); drawMascot(m, POSES[pose]);
}
const flagImg = (code, h, extra = '') => `<img src="${FLAG_DIR}${code}.svg" style="height:${h}px;border-radius:${Math.round(h * 0.07)}px;box-shadow:0 0 0 1px rgba(22,59,50,.08), 0 6px 16px rgba(22,59,50,.12);display:block;${extra}">`;
const chip = (text, bg, fg, size = 26) => `<span style="display:inline-block;padding:8px 20px;border-radius:999px;background:${bg};color:${fg};font-weight:800;font-size:${size}px;letter-spacing:.06em">${text}</span>`;
function bubble(x, y, html, { size = 38, tail = 'left', w = null, z = 35 } = {}) {
  const b = el(stage, { left: x, top: y, padding: '18px 28px', borderRadius: 30, background: C.white, zIndex: z, fontFamily: 'Fredoka', fontWeight: 500, fontSize: size, color: C.forest,
    whiteSpace: w ? 'normal' : 'pre', width: w, boxShadow: '0 12px 34px rgba(22,59,50,.14)' }, html);
  const tl = { left: 'left:-12px;top:50%;margin-top:-14px', right: 'right:-12px;top:50%;margin-top:-14px', down: 'left:50%;bottom:-12px;margin-left:-14px' }[tail];
  el(b, {}, '', 'x').outerHTML = `<div style="position:absolute;${tl};width:28px;height:28px;background:#fff;transform:rotate(45deg);border-radius:4px"></div>`;
  return b;
}
// three answer rows (A, B, C), like the quiz cards
function options(x, y, w, opts) {
  opts.forEach((o, i) => el(stage, { left: x, top: y + i * 150, width: w, height: 122, borderRadius: 26, background: C.white, zIndex: 8, display: 'flex', alignItems: 'center', gap: '26px', padding: '0 30px',
    boxShadow: '0 2px 6px rgba(22,59,50,.05), 0 14px 36px rgba(22,59,50,.09)' },
    `<span style="width:60px;height:60px;border-radius:30px;background:${C.chip};display:grid;place-items:center;font-weight:800;font-size:26px;color:${C.green};flex:none">${'ABC'[i]}</span><span style="font-family:Fredoka;font-weight:500;font-size:46px;color:${C.forest};white-space:nowrap">${o}</span>`));
}
// a country at true scale: its shape in laea around its own centre, s px per sphere radius, centred on (cx, cy)
function shapeAt(svg, code, cx, cy, s, fill) {
  const ctr = geoCentre(code), P = laea(ctr.lon, ctr.lat);
  const rings = ctr.near.flatMap(poly => poly.map(r => r.map(([lo, la]) => P(lo, la))));
  const b = bboxOf(rings.flat()), ox = cx - s * (b[0] + b[2]) / 2, oy = cy - s * (b[1] + b[3]) / 2;
  svgEl(svg, 'path', { d: rings.map(r => r.map(([x, y], i) => (i ? 'L' : 'M') + (ox + s * x).toFixed(1) + ' ' + (oy + s * y).toFixed(1)).join('') + 'Z').join(''), fill, stroke: C.forest, 'stroke-width': 3, 'stroke-linejoin': 'round' });
  return { w: s * (b[2] - b[0]), h: s * (b[3] - b[1]) };
}
const pageSvg = (z = 9) => { const s = svgEl(stage, 'svg', { width: 1080, height: 1920 }); S(s, { position: 'absolute', left: 0, top: 0, zIndex: z }); return s; };

// ------------------------------------------------------------------ the cards
function factCard(day, eyebrow, l1, l2, top, opts, pose) {
  header(day); title(eyebrow, l1, l2); cta();
  const t = el(stage, { left: X0, top: 870, zIndex: 8, display: 'flex', gap: '18px', alignItems: 'center' }, top);
  options(X0, 1060, 600, opts);
  roviko(800, 1290, 270, pose);
}
function flagCard(day, level, l1, l2, code, pose) {
  header(day); title(`Flag a Day · ${level}`, l1, l2); cta();
  const c = wcard(CX, CY, CW, 600);
  el(c, { left: 0, top: 0, width: CW, height: 600, display: 'flex', alignItems: 'center', justifyContent: 'center' }, flagImg(code, 300));
  el(c, { left: 36, top: 32 }, chip(`DAY ${day}/30`, C.chip, C.green, 22));
  el(c, { left: CW - 36 - 96, top: 24, width: 96, height: 96, borderRadius: 48, background: C.forest, color: C.white, display: 'grid', placeItems: 'center', fontFamily: 'Fredoka', fontWeight: 600, fontSize: 52 }, '3');
  el(c, { left: 40, top: 528, fontWeight: 800, fontSize: 24, letterSpacing: '.14em', color: 'rgba(22,59,50,.45)' }, 'COMMENT YOUR ANSWER 👇');
  roviko(840, 1500, 250, pose);
}

const BANNERS = {
  // ---- day 15
  '15-funny': () => {
    header(15); title('Funny · From memory', 'I drew Europe', 'from memory.'); cta();
    wcard(CX, CY, CW, 640);
    const g = pageSvg(), k = 0.7, mx = x => 540 + (x - 560) * k, my = y => 1180 + (y - 840) * k;
    const blobs = [[330, 690, 60, 60, 3, 12, 0, '#FFD7A8', 'UK ⭕', 330, 600], [300, 1050, 105, 95, 7, 4, 0.1, '#FFE9A8', 'Spain (a square)', 300, 1050],
      [420, 880, 85, 80, 11, 12, 0, '#C9E2FF', 'France?', 420, 880], [640, 1040, 32, 170, 5, 12, -0.5, '#BFEBD0', 'Italy (long boy)', 730, 1150],
      [640, 560, 22, 130, 9, 12, 0.6, '#FFD0D2', 'Norway 🍝', 560, 500], [600, 820, 70, 70, 13, 12, 0, '#E8DDFE', 'Germany-ish', 620, 820]];
    const blob = (cx, cy, rx, ry, seed, n, rot) => {
      const r = rng(seed), pts = [];
      for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, q = 0.82 + r() * 0.36, x = Math.cos(a) * rx * q, y = Math.sin(a) * ry * q;
        pts.push([mx(cx + x * Math.cos(rot) - y * Math.sin(rot)), my(cy + x * Math.sin(rot) + y * Math.cos(rot))]); }
      let d = `M${((pts[n - 1][0] + pts[0][0]) / 2).toFixed(1)} ${((pts[n - 1][1] + pts[0][1]) / 2).toFixed(1)}`;
      pts.forEach((p, i) => { const q = pts[(i + 1) % n]; d += `Q${p[0].toFixed(1)} ${p[1].toFixed(1)} ${((p[0] + q[0]) / 2).toFixed(1)} ${((p[1] + q[1]) / 2).toFixed(1)}`; });
      return d + 'Z';
    };
    blobs.forEach(([cx, cy, rx, ry, seed, n, rot, fill, label, lx, ly]) => {
      svgEl(g, 'path', { d: blob(cx, cy, rx, ry, seed, n, rot), fill, stroke: C.forest, 'stroke-width': 5, 'stroke-linejoin': 'round' });
      const l = el(stage, { zIndex: 10, fontFamily: 'Fredoka', fontWeight: 500, fontSize: 28, color: C.forest, whiteSpace: 'pre' }, label);
      LAYOUT.push(() => { const r = l.getBoundingClientRect(); S(l, { left: mx(lx) - r.width / 2, top: my(ly) - r.height / 2 }); });
    });
    svgEl(g, 'path', { d: `M${mx(760)} ${my(930)}c21 -28 42 14 28 28s-42 -21 -14 -42 49 7 35 35 -35 14 -21 -7 28 -28 42 -7`, fill: 'none', stroke: C.forest, 'stroke-width': 5, 'stroke-linecap': 'round' });
    el(stage, { left: CX + CW - 250, top: CY + 30, zIndex: 10 }, chip('BY ROVIKO ✏️', C.chip, C.green, 22));
    bubble(380, 1478, 'Rate my Europe 1–10 👇');
    roviko(230, 1500, 230, 'cool');
  },
  '15-fact': () => factCard(15, 'Sounds fake · South America', 'Brazil has 10 neighbours.', 'Which 2 don’t?', flagImg('br', 132),
    ['Chile & Ecuador', 'Peru & Chile', 'Colombia & Ecuador'], 'think'),
  '15-flag': () => flagCard(15, 'Easy', 'Warm-up flag.', '3 seconds. Go.', 'tr', 'wave'),
  '15-viral': () => {
    header(15); title('Flag race', 'Guess the flag', 'before I do.'); cta();
    wcard(CX, CY, CW, 640);
    ['no', 'gr', 'gh', 'se'].forEach((c, i) => {
      const x = CX + 60 + (i % 2) * 390, y = CY + 70 + Math.floor(i / 2) * 270;
      el(stage, { left: x, top: y, width: 330, height: 190, zIndex: 8, display: 'flex', justifyContent: 'center', alignItems: 'center' }, flagImg(c, 170));
      el(stage, { left: x + 290, top: y - 18, width: 60, height: 60, borderRadius: 30, background: C.forest, color: C.white, zIndex: 9, display: 'grid', placeItems: 'center', fontFamily: 'Fredoka', fontWeight: 600, fontSize: 34 }, '?');
    });
    bubble(130, 1570, 'Me: 1/4 🙈  Beat me 👇');
    roviko(820, 1480, 250, 'nervous');
  },
  // ---- day 16
  '16-funny': () => {
    header(16); title('Side by side', 'Japan or Germany?', 'Which is bigger?'); cta();
    wcard(CX, CY, CW, 600);
    const g = pageSvg(), s = 1050;
    shapeAt(g, 'JPN', 330, 1130, s, '#CFE9DA'); shapeAt(g, 'DEU', 760, 1130, s, '#CFE9DA');
    el(stage, { left: 510, top: 1100, width: 64, height: 64, borderRadius: 32, background: C.chip, zIndex: 10, display: 'grid', placeItems: 'center', fontWeight: 800, fontSize: 24, color: C.forest }, 'vs');
    [['Japan', 330], ['Germany', 760]].forEach(([n, x]) => { const l = el(stage, { top: 1370, zIndex: 10, fontFamily: 'Fredoka', fontWeight: 600, fontSize: 44, color: C.forest, whiteSpace: 'pre' }, n);
      LAYOUT.push(() => S(l, { left: x - l.getBoundingClientRect().width / 2 })); });
    el(stage, { left: CX + 30, top: CY + 30, zIndex: 10 }, chip('TRUE SCALE', C.chip, C.green, 22));
    bubble(350, 1500, 'Germany. Obviously 😎');
    roviko(210, 1520, 220, 'cool');
  },
  '16-fact': () => factCard(16, 'Sounds fake · Flags', 'Only 1 flag in the world', 'isn’t a rectangle.',
    `<div style="width:198px;height:132px;border-radius:10px;border:4px dashed rgba(22,59,50,.35);display:grid;place-items:center;font-family:Fredoka;font-weight:600;font-size:64px;color:${C.green}">?</div>`,

  '16-flag': () => flagCard(16, 'Medium', 'Name this flag', 'in 3 seconds.', 'mn', 'think'),

    const m = msg(CY + 230, 'Which country?', true); LAYOUT.push(() => S(m, { left: CX + CW - 40 - m.getBoundingClientRect().width }));

    roviko(820, 1490, 250, 'palm');
  },
  '17-fact': () => factCard(17, 'Sounds fake · Cities', 'This city lies on', 'two continents.', flagImg('tr', 132) + chip('EUROPE + ASIA', C.chip, C.green, 22),
    ['Cairo', 'Istanbul', 'Moscow'], 'think'),
  '17-flag': () => flagCard(17, 'Trap', 'Looks easy.', 'It’s a trap.', 'au', 'nervous'),
  '17-viral': () => {

    wcard(CX, CY, CW, 620);
    el(stage, { left: CX + 40, top: CY + 36, zIndex: 9, fontWeight: 800, fontSize: 24, letterSpacing: '.12em', color: C.green }, 'RESULTS · ROUND 10/10');

        `<span style="width:52px;text-align:center;font-family:Fredoka;font-weight:600;font-size:40px;color:${C.forest}">${r}</span><span style="width:64px;height:64px;border-radius:32px;background:${col};display:grid;place-items:center;color:#fff;font-family:Fredoka;font-weight:600;font-size:32px">${n[0]}</span><span style="flex:1;font-family:Fredoka;font-weight:500;font-size:42px;color:${C.forest}">${n}${n === 'Lucas' ? ' 🙈' : ''}</span><span style="font-family:Fredoka;font-weight:600;font-size:40px;color:${C.green}">${p}</span>`);
    });
    roviko(860, 1540, 220, 'cheer');
  },
  // ---- day 18
  '18-funny': () => {
    header(18); title('Say it right', 'Countries you’ve been', 'saying wrong.'); cta();

    [['ki', 'Kiribati', 'Kiri-BAH-tee', 'KIRR-i-bass'], ['ls', 'Lesotho', 'Leh-SO-tho', 'Leh-SOO-too'], ['ne', 'Niger', 'NYE-jer', 'Nee-ZHAIR'], ['nr', 'Nauru', 'NOR-oo', 'Nah-OO-roo']].forEach(([f, n, bad, good], i) => {

        `${flagImg(f, 64, 'flex:none')}<div style="flex:1"><div style="font-family:Fredoka;font-weight:600;font-size:42px;color:${C.forest};line-height:1.1">${n}</div><div style="font-weight:700;font-size:26px;color:${C.red};text-decoration:line-through">${bad}</div></div><span style="padding:12px 22px;border-radius:999px;background:#2FBF71;color:#fff;font-family:Fredoka;font-weight:600;font-size:36px;white-space:nowrap">✓ ${good}</span>`);

  '18-fact': () => factCard(18, 'Sounds fake · Distances', 'Europe to Africa:', 'how far, really?', flagImg('es', 132) + flagImg('ma', 132),
    ['14 km', '140 km', '400 km'], 'shock'),
  '18-flag': () => flagCard(18, 'Medium', 'Name this flag', 'before it’s gone.', 'jm', 'wink'),
  // ---- day 19
  '19-funny': () => {

    el(stage, { left: CX + 36, top: CY + 30, zIndex: 9, fontWeight: 800, fontSize: 22, letterSpacing: '.12em', color: C.green }, 'TONIGHT');
    el(stage, { left: CX + 36, top: CY + 62, zIndex: 9, display: 'flex', alignItems: 'baseline', gap: '18px' },
      `<span style="font-family:Fredoka;font-weight:600;font-size:46px;color:rgba(22,59,50,.4);text-decoration:line-through">20:00</span><span style="font-family:Fredoka;font-weight:600;font-size:76px;color:${C.red}">02:47</span>`);
    [['🧭', 'Daily Detour'], ['📡', 'Rank Radar'], ['⚔️', 'World Duel'], ['⚖️', 'Side by Side'], ['🔎', 'Clue Trail'], ['🔥', 'Survival']].forEach(([e, n], i) =>
      el(stage, { left: CX + 36, top: CY + 180 + i * 76, width: 528, zIndex: 9, display: 'flex', alignItems: 'center', gap: '18px', fontFamily: 'Fredoka', fontWeight: 500, fontSize: 36, color: C.forest },
