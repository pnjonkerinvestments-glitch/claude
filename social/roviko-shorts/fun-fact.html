<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Roviko: Sounds fake, but it's true</title>
<!--
  "Sounds fake, but it's true": a country fact as a 20 s quiz. 1080x1920 (TikTok / Reels), 110 BPM ("Aerobic Fashion",
  Mixkit, from song beat 50, so its 4-beat break lands under the knock-outs and its drop on the reveal).
    fun-fact.html?n=1   (1 border, 2 pyramids, 3 rivers, 4 lakes, 5 landlocked … 11-20 use the data-driven `generic` map scene)
  Frame 1 is the thumbnail: the hook, the question and the A/B/C answers. "Comment A, B or C" + 3-2-1 (the viewer answers
  in the comments); time's up on the break; the wrong answers are knocked out one by one (the tempting one last);
  the true one floods green on the drop. Then the fact is shown on a map, then the bonus fact promised by the top pill from frame 1
  (an open loop, so people stay), then "Got it right?" and the end card.
  Same rules as the launch film: seek(t) draws the whole frame from t; nothing fades; springs; a real sound on every event.
-->
<style>

<script>

});

const endCard = EndCard(stage, { my: 690, tagline: 'Sounds fake. Play it daily.' });

// ------------------------------------------------------------------ explainer pieces
const CARD = { x: 140, y: 430, w: 800, h: 640 };
const SEA = '#CDE8F6', LAND = '#E2EFE8', SAND = '#F8DFA6';
// a map window in the card: laea around (lon, lat), fitted to `fit` (ISO3 ids) or a given radius R
function MapCard({ lon, lat, fit = null, pad = 0.16, R = null, shift = [0, 0], hi = {}, extra = [], eq = null }) {
  const P = laea(lon, lat), cx = CARD.x + CARD.w / 2, cy = CARD.y + CARD.h / 2;
  let ox = 0, oy = 0;
  if (fit) {
    const pts = fit.flatMap(id => geoCentre(id).near.flatMap(poly => poly[0])).map(([a, b]) => P(a, b));
    const bb = bboxOf(pts);
    R = Math.min(CARD.w * (1 - pad) / (bb[2] - bb[0]), CARD.h * (1 - pad) / (bb[3] - bb[1]));
    ox = -(bb[0] + bb[2]) / 2; oy = -(bb[1] + bb[3]) / 2;
  }
  // eq: {k} = a flat (equirectangular) world map, k px per degree, for views that span the whole globe
  const scr = eq ? (lo, la) => [cx + (lo - lon) * eq.k + shift[0], cy - (la - lat) * eq.k + shift[1], 1]
    : (lo, la) => { const [x, y, c] = P(lo, la); return [cx + R * (x + ox) + shift[0], cy + R * (y + oy) + shift[1], c]; };
  const ringD = r => {
    const pts = r.map(([lo, la]) => scr(lo, la));
    if (pts.every(p => p[2] < 0.05)) return '';
    const bb = bboxOf(pts);
    if (bb[2] < CARD.x - 400 || bb[0] > CARD.x + CARD.w + 400 || bb[3] < CARD.y - 400 || bb[1] > CARD.y + CARD.h + 400) return '';
    let d = '', last = null;
    pts.forEach((p, i) => { if (last && i < pts.length - 1 && Math.hypot(p[0] - last[0], p[1] - last[1]) < 1.2) return;
      const jump = eq && last && Math.abs(p[0] - last[0]) > 180 * eq.k;   // the antimeridian on a flat map: start a new piece
      d += (d && !jump ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); last = p; });
    return d + 'Z';
  };
  const dOf = id => GEO[id].map(poly => poly.map(ringD).join('')).join('');
  const outer = el(sceneL, { left: CARD.x - 12, top: CARD.y - 12, width: CARD.w + 24, height: CARD.h + 24, borderRadius: 52, background: C.white, transformOrigin: '50% 50%',
    boxShadow: '0 4px 10px rgba(22,59,50,.08), 0 30px 70px rgba(22,59,50,.18)' });
  const win = el(outer, { left: 12, top: 12, width: CARD.w, height: CARD.h, borderRadius: 40, overflow: 'hidden', background: SEA });
  const layer = el(win, { left: -CARD.x, top: -CARD.y, width: W, height: H });
  const over = el(outer, { left: -(CARD.x - 12), top: -(CARD.y - 12), width: W, height: H, zIndex: 5 });
  const svg = svgEl(layer, 'svg', { width: W, height: H }); svg.style.position = 'absolute';
  const defs = svgEl(svg, 'defs');
  extra.forEach(x => svgEl(svg, 'path', { d: ringD(x.ring), fill: x.fill || LAND, stroke: '#fff', 'stroke-width': 1.6, 'stroke-linejoin': 'round' }));
  let land = '';
  for (const id in GEO) if (!(id in hi)) land += dOf(id);
  for (const r of GEO_EXTRA) land += ringD(r);
  svgEl(svg, 'path', { d: land, fill: LAND, stroke: '#fff', 'stroke-width': 1.6, 'stroke-linejoin': 'round' });
  const paths = {};
  for (const id in hi) paths[id] = svgEl(svg, 'path', { d: dOf(id), fill: hi[id], stroke: '#fff', 'stroke-width': 1.8, 'stroke-linejoin': 'round' });
  const ctx = document.createElement('canvas').getContext('2d');
  return { outer, win, layer, over, svg, defs, paths, scr, R, dOf, ringD,
    inside: (d, x, y) => ctx.isPointInPath(new Path2D(d), x, y) };
}
// a label pill with an optional app flag, placed by its centre
function Label(parent, text, { flag = null, bg = C.white, fg = C.forest, size = 34, h = 66, z = 10 } = {}) {
  const e = el(parent, { height: h, borderRadius: h / 2, background: bg, color: fg, fontFamily: 'Fredoka', fontWeight: 600, fontSize: size, lineHeight: h + 'px', whiteSpace: 'pre', zIndex: z,
    padding: flag ? `0 ${h * 0.4}px 0 ${h * 0.2}px` : `0 ${h * 0.4}px`, transformOrigin: '50% 50%', boxShadow: '0 8px 20px rgba(22,59,50,.16)', display: 'flex', alignItems: 'center', gap: h * 0.18 + 'px' },
    (flag ? `<img src="${FLAGS}${flag}.svg" style="height:${h * 0.56}px;width:${h * 0.75}px;object-fit:cover;border-radius:${h * 0.1}px;box-shadow:0 0 0 2px rgba(22,59,50,.1)">` : '') + `<span>${text}</span>`);
  e.querySelectorAll('b').forEach(b => S(b, { color: C.green, fontWeight: 600 }));
  let cx = 0, cy = 0;
  LAYOUT.push(() => { const r = e.getBoundingClientRect(); S(e, { left: cx - r.width / 2, top: cy - h / 2 }); });
  return { e, at(x, y) { cx = x; cy = y; return this; },
    pop(t, b, out = null) { const p = spB(t, b, 2.6, 0.55) * (out == null ? 1 : 1 - E.inBack(segB(t, out, out + 0.35, E.lin))); S(e, { transform: `scale(${p})` }); show(e, p > 0.001); return p; } };
}
// the card's entrance (springs up from the mascot's side) and exit
function cardIn(card, t) {
  const p = spB(t, TL.explain + 0.1, 2.1, 0.62), q = segB(t, TL.end - 0.4, TL.end - 0.05, E.inBack);
  S(card.outer, { transform: `scale(${lerp(0.3, 1, clamp(p, 0, 1.1)) * (1 - q)})` }); show(card.outer, p > 0.001 && q < 1);
  return p;
}
// a clip circle growing from (x, y) between beats b0 and b1 (a flood)
function flood(defs, id, x, y, rMax) {
  const c = svgEl(svgEl(defs, 'clipPath', { id }), 'circle', { cx: x, cy: y, r: 0 });
  return (t, b0, b1) => { const f = segB(t, b0, b1, E.outCubic); c.setAttribute('r', (rMax * f).toFixed(1)); return f; };
}
const pyramidSvg = (s, c1 = '#E7A63A', c2 = '#C9861E') => `<svg width="${s}" height="${s * 0.8}" viewBox="0 0 30 24"><path d="M15 1L29 23H15z" fill="${c2}"/><path d="M15 1L1 23H15z" fill="${c1}"/><path d="M15 1L1 23H29z" fill="none" stroke="#7A4A00" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
const dropSvg = s => `<svg width="${s}" height="${s * 1.3}" viewBox="0 0 20 26"><path d="M10 1C10 1 2 11 2 17a8 8 0 0016 0C18 11 10 1 10 1z" fill="${C.ocean}" stroke="#fff" stroke-width="2"/></svg>`;
const planeSvg = s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M21 15.5v-2L13.5 9V4a1.5 1.5 0 00-3 0v5L3 13.5v2l7.5-2.3V18l-2 1.5V21l3.5-1 3.5 1v-1.5l-2-1.5v-4.8z" fill="${C.ink}" stroke="#fff" stroke-width="1" stroke-linejoin="round"/></svg>`;

// ------------------------------------------------------------------ the five explainers
// each returns update(t, b) and registers its own sounds
const SCENES = {
  // 1. France's longest border is with Brazil (French Guiana, 730 km); bonus: France and the Netherlands share Saint Martin
  border() {
    const m = MapCard({ lon: -53.4, lat: 2.6, R: 2600, shift: [0, 40], hi: { BRA: '#BFE3D2' }, extra: [{ ring: FRENCH_GUIANA, fill: LAND }] });
    const gufD = m.ringD(FRENCH_GUIANA);
    const gc = m.scr(-53.1, 4.0);
    const fl = flood(m.defs, 'gufFlood', gc[0], gc[1], 180);
    svgEl(m.svg, 'path', { d: gufD, fill: C.gold, stroke: C.forest, 'stroke-width': 3, 'stroke-linejoin': 'round', 'clip-path': 'url(#gufFlood)' });
    // the Brazil border of French Guiana (its southern and eastern edge, the Oyapock and the Tumuc-Humac hills)
    const bRing = FRENCH_GUIANA.slice(0, 9);
    const bD = 'M' + bRing.map(([a, b]) => m.scr(a, b).slice(0, 2).map(v => v.toFixed(1)).join(' ')).join('L');
    const bord = svgEl(m.svg, 'path', { d: bD, fill: 'none', stroke: C.red, 'stroke-width': 9, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', pathLength: 1, 'stroke-dasharray': '1 1' });
    const lBra = Label(m.layer, 'Brazil', { flag: 'br', size: 36 }).at(...m.scr(-53.8, 0.6).slice(0, 2));
    const lGuf = Label(m.over, 'French Guiana = <b>France</b>', { flag: 'fr', size: 34 }).at(540, 520);
    const lKm = Label(m.over, '730 km', { bg: C.red, fg: C.white, size: 40, h: 72 }).at(...(([x, y]) => [x + 120, y + 30])(m.scr(-52.4, 2.4)));
    const lSpain = Label(m.over, 'Longer than the border with Spain!', { size: 30, h: 60 }).at(540, 1024);
    // bonus: one island, two countries
    const isl = el(sceneL, { left: CARD.x - 12, top: CARD.y - 12, width: CARD.w + 24, height: CARD.h + 24, borderRadius: 52, background: C.white, transformOrigin: '50% 50%', zIndex: 2,
      boxShadow: '0 4px 10px rgba(22,59,50,.08), 0 30px 70px rgba(22,59,50,.18)' });
    const iw = el(isl, { left: 12, top: 12, width: CARD.w, height: CARD.h, borderRadius: 40, overflow: 'hidden', background: SEA });
    const isvg = svgEl(iw, 'svg', { width: CARD.w, height: CARD.h, viewBox: `0 0 ${CARD.w} ${CARD.h}` });
    const blob = 'M120 300C140 210 250 170 360 190C450 205 520 160 610 185C700 210 720 300 680 360C650 410 560 420 500 450C420 490 330 480 250 450C170 420 105 370 120 300Z';
    const icp = svgEl(svgEl(isvg, 'defs'), 'clipPath', { id: 'isl' }); svgEl(icp, 'path', { d: blob });
    svgEl(isvg, 'path', { d: blob, fill: '#fff', transform: 'translate(0 10)', opacity: 0.6 });
    svgEl(isvg, 'rect', { x: 0, y: 0, width: CARD.w, height: 320, fill: C.gold, 'clip-path': 'url(#isl)' });
    svgEl(isvg, 'rect', { x: 0, y: 320, width: CARD.w, height: 400, fill: '#F08A3C', 'clip-path': 'url(#isl)' });
    svgEl(isvg, 'path', { d: 'M100 330C260 300 520 340 720 312', fill: 'none', stroke: C.forest, 'stroke-width': 5, 'stroke-dasharray': '14 10' });
    svgEl(isvg, 'path', { d: blob, fill: 'none', stroke: C.forest, 'stroke-width': 4 });
    const lFr = Label(isl, 'France', { flag: 'fr', size: 34 }).at(400, 250);
    const lNl = Label(isl, 'Netherlands', { flag: 'nl', size: 34 }).at(420, 410);
    const lSm = Label(isl, 'Saint Martin, Caribbean', { size: 30, h: 60, bg: C.forest, fg: C.white }).at(412, 570);
    ev(TL.explain + 0.9, 'expand', -8); ev(TL.explain + 1.6, 'pop', -8); ev(TL.explain + 2.6, 'swoosh', -9); ev(TL.explain + 3.0, 'pop', -6, { rate: 0.9 });
    ev(TL.explain + 4.6, 'pop', -10, { rate: 1.1 });
    ev(TL.bonus + 0.35, 'morph', -6); ev(TL.bonus + 1.2, 'pop', -9); ev(TL.bonus + 1.6, 'pop', -9, { rate: 1.1 }); ev(TL.bonus + 2.4, 'pop', -11, { rate: 1.2 });
    return (t, b) => {
      const flip = segB(t, TL.bonus + 0.1, TL.bonus + 0.35, E.inCubic), flip2 = segB(t, TL.bonus + 0.35, TL.bonus + 0.65, E.outCubic);
      const p = cardIn(m, t);
      S(m.outer, { transform: `scale(${lerp(0.3, 1, clamp(p, 0, 1.1))}) scaleX(${1 - flip})` }); show(m.outer, p > 0.001 && flip < 1);
      fl(t, TL.explain + 0.9, TL.explain + 1.9);
      lGuf.pop(t, TL.explain + 1.5); lBra.pop(t, TL.explain + 1.0);
      bord.setAttribute('stroke-dashoffset', (1 - segB(t, TL.explain + 2.5, TL.explain + 3.4, E.inOutCubic)).toFixed(4));
      lKm.pop(t, TL.explain + 2.9); lSpain.pop(t, TL.explain + 4.5);
      const q = segB(t, TL.end - 0.4, TL.end - 0.05, E.inBack);
      S(isl, { transform: `scaleX(${flip2}) scale(${1 - q})` }); show(isl, flip2 > 0.001 && q < 1);
      lFr.pop(t, TL.bonus + 1.1); lNl.pop(t, TL.bonus + 1.5); lSm.pop(t, TL.bonus + 2.3);
    };
  },

  // 2. Sudan has about twice as many pyramids as Egypt (200+ vs about 120); bonus: Nubian pyramids are steeper (~70 vs 52 degrees)
  pyramids() {
    const m = MapCard({ lon: 31, lat: 21, fit: ['EGY', 'SDN'], pad: 0.1, shift: [-40, 0], hi: { EGY: SAND, SDN: SAND } });
    const r = rng(7);
    // icons where the pyramids really are: Egypt along the Nile from Giza to Meidum; Sudan at el-Kurru/Nuri and Meroe
    const sites = [{ c: [31.15, 29.6], n: 12, sp: 46 }, { c: [31.85, 18.5], n: 10, sp: 44 }, { c: [33.75, 16.94], n: 12, sp: 44 }];
    const icons = [];
    sites.forEach((s, k) => { const [x0, y0] = m.scr(...s.c); for (let i = 0; i < s.n; i++) {

  // 11-20: one data-driven map explainer (F.map, and F.map2 for the bonus when it needs another place).
  // Items: floods (a country or ring fills from a point), pins (pulsing rings), lines (drawn on), labels and big flags.
  // `b` is in beats after the explain or the bonus start ('bonus: true'); explain items leave when the bonus comes.
  generic() {
    const mk = spec => {
      const hi = {}; (spec.hi || []).forEach(([id, col]) => { hi[id] = col; });
      (spec.floods || []).forEach(f => { if (typeof f.id === 'string' && !(f.id in hi)) hi[f.id] = LAND; });
      const extra = (spec.rings || []).map(([ring, fill]) => ({ ring, fill }));
      return MapCard({ lon: spec.lon, lat: spec.lat, fit: spec.fit || null, pad: spec.pad ?? 0.2, R: spec.R || null, shift: spec.shift || [0, 0], hi, extra });
    };
    const maps = [mk(F.map)];
    if (F.map2) { maps.push(mk(F.map2)); S(maps[1].outer, { zIndex: 3 }); }
    const at = (m, p) => p.px ? p.px : m.scr(...p.at).slice(0, 2);
    const t0 = it => (it.bonus ? TL.bonus : TL.explain) + it.b;
    const mapOf = it => maps[it.map2 ? 1 : 0];
    let fid = 0;
    const floods = [], pins = [], lines = [], labels = [], imgs = [];
    const add = (spec, mi) => {
      const m = maps[mi];
      (spec.floods || []).forEach(f => {
        const d = typeof f.id === 'string' ? m.dOf(f.id) : f.id.map(r => m.ringD(r)).join('');
        const [x, y] = at(m, f);
        const id = 'gf' + fid++;
        const fl = flood(m.defs, id, x, y, f.r || 900);
        svgEl(m.svg, 'path', { d, fill: f.fill || C.gold, stroke: f.stroke || C.forest, 'stroke-width': f.sw || 3, 'stroke-linejoin': 'round', 'clip-path': `url(#${id})` });
        floods.push({ fl, b: t0(f), dur: f.dur || 1.0 });
        ev(t0(f), 'land', -6, { rate: f.rate || 1 });
      });
      (spec.lines || []).forEach(l => {
        const pts = l.pts.map(p => m.scr(...p).slice(0, 2));
        const d = 'M' + pts.map(p => p.map(v => v.toFixed(1)).join(' ')).join('L');
        const p = svgEl(m.svg, 'path', { d, fill: 'none', stroke: l.color || C.red, 'stroke-width': l.w || 8, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', pathLength: 1, 'stroke-dasharray': '1 1', 'stroke-dashoffset': 1 });
        lines.push({ p, b: t0(l), out: l.bonus ? null : TL.bonus - 0.3 });
        ev(t0(l), 'swoosh', -9);
      });
      (spec.pins || []).forEach(pn => {
        const [x, y] = at(m, pn), r = pn.r || 30;
        const e = el(m.layer, { left: x - r, top: y - r, width: 2 * r, height: 2 * r, borderRadius: r, border: `${Math.max(5, r / 5)}px solid ${pn.color || C.red}`, background: pn.fill || 'rgba(255,255,255,.55)', zIndex: 5, transformOrigin: '50% 50%' });
        pins.push({ e, b: t0(pn), out: pn.bonus || pn.keep ? null : TL.bonus - 0.3 });
        ev(t0(pn), 'pin', -7);
      });
      (spec.labels || []).forEach(lb => {
        const L = Label(m.over, lb.t, { flag: lb.flag || null, size: lb.size || 32, h: lb.h || 62, bg: lb.bg === 'red' ? C.red : lb.bg === 'forest' ? C.forest : lb.bg === 'gold' ? C.gold : lb.bg === 'green' ? C.green : C.white,
          fg: ['red', 'forest', 'green'].includes(lb.bg) ? C.white : C.forest, z: 10 });
        const p = lb.px ? lb.px : (([x, y]) => [x + (lb.dx || 0), y + (lb.dy || 0)])(m.scr(...lb.at).slice(0, 2));
        L.at(...p);
        labels.push({ L, b: t0(lb), out: lb.bonus || lb.keep ? null : TL.bonus - 0.3 });
        ev(t0(lb), 'pop', -9, { rate: 0.95 + (labels.length % 4) * 0.06 });
      });
      (spec.flags || []).forEach(fg => {
        const h = fg.h || 220;
        const e = el(m.over, { left: fg.px[0] - h * 0.75, top: fg.px[1] - h / 2, width: h * 1.5, height: h, zIndex: 9, transformOrigin: '50% 50%', display: 'flex', justifyContent: 'center', alignItems: 'center' },
          `<img src="${FLAGS}${fg.code}.svg" style="height:${h}px;max-width:${h * 1.5}px;filter:drop-shadow(0 12px 22px rgba(22,59,50,.25))">`);
        imgs.push({ e, b: t0(fg), out: fg.bonus || fg.keep ? null : TL.bonus - 0.3 });
        ev(t0(fg), 'boing', -8);
      });
    };
    add(F.map, 0); if (F.map2) add(F.map2, 1);
    const bottom = (txt, bonus, mi) => txt ? (() => { const L = Label(maps[mi].over, txt, { size: 28, h: 58, bg: C.forest, fg: C.white }).at(540, 1024); ev((bonus ? TL.bonus : TL.explain) + (bonus ? 2.4 : 3.6), 'pop', -9); return { L, b: (bonus ? TL.bonus + 2.4 : TL.explain + 3.6), out: bonus ? null : TL.bonus - 0.3 }; })() : null;
    const bots = [bottom(F.map.bottom, false, 0), bottom((F.map2 || F.map).bonusBottom, true, F.map2 ? 1 : 0)].filter(Boolean);
    ev(TL.explain + 0.9, 'expand', -9);
    if (F.map2) { ev(TL.bonus + 0.05, 'swoosh', -8); }
    return (t, b) => {
      if (F.map2) {
        const p = spB(t, TL.explain + 0.1, 2.1, 0.62), q = segB(t, TL.bonus - 0.35, TL.bonus, E.inBack);
        S(maps[0].outer, { transform: `scale(${lerp(0.3, 1, clamp(p, 0, 1.1)) * (1 - q)})` }); show(maps[0].outer, p > 0.001 && q < 1);
        const p2 = spB(t, TL.bonus, 2.1, 0.62), q2 = segB(t, TL.end - 0.4, TL.end - 0.05, E.inBack);
        S(maps[1].outer, { transform: `scale(${lerp(0.3, 1, clamp(p2, 0, 1.1)) * (1 - q2)})` }); show(maps[1].outer, p2 > 0.001 && q2 < 1);
      } else cardIn(maps[0], t);
      floods.forEach(f => f.fl(t, f.b, f.b + f.dur));
      lines.forEach(l => { const d = segB(t, l.b, l.b + 0.9, E.inOutCubic), o = l.out != null ? segB(t, l.out, l.out + 0.3, E.lin) : 0;
        l.p.setAttribute('stroke-dashoffset', (1 - d).toFixed(3)); l.p.style.opacity = d > 0.001 && o < 1 ? 1 : 0; });
      pins.forEach(pn => { const o = pn.out != null ? E.inBack(segB(t, pn.out, pn.out + 0.3, E.lin)) : 0, q = spB(t, pn.b, 2.6, 0.5) * (1 - o);
        S(pn.e, { transform: `scale(${q * (1 + 0.07 * Math.sin(t * 7))})` }); show(pn.e, q > 0.001); });
      labels.forEach(l => l.L.pop(t, l.b, l.out));
      bots.forEach(l => l.L.pop(t, l.b, l.out));
      imgs.forEach(im => { const o = im.out != null ? E.inBack(segB(t, im.out, im.out + 0.3, E.lin)) : 0, q = spB(t, im.b, 2.4, 0.5) * (1 - o);
        S(im.e, { transform: `scale(${q}) rotate(${(1 - clamp(q)) * -14}deg)` }); show(im.e, q > 0.001); });
    };
  },
};
const scene = SCENES[F.scene]();

// ------------------------------------------------------------------ sound
ev(0.02, 'pop', -12, { rate: 1.1 });
ev(TL.hint + 0.05, 'mention', -8);
[TL.n3, TL.n2, TL.n1].forEach((b, i) => ev(b, 'clock', -3, { rate: 1 + i * 0.06 }));
ev(TL.up, 'lock', -3);
TL.out.forEach((b, i) => ev(b, 'error', -5 + i));
TL.drum.forEach((b, i) => ev(b, 'clock', -7 + i, { rate: 1.1 + i * 0.05 }));
ev(TL.reveal, 'impact', -2); ev(TL.reveal + 0.05, 'correct', -4); ev(TL.reveal + 0.2, 'sparkle', -6);
ev(TL.wow + 0.1, 'boing', -7);
ev(TL.explain + 0.1, 'swoosh', -7);
ev(TL.bonus, 'levelup', -5);
ev(TL.cap3 + 0.1, 'mention', -7);
ev(TL.end + 0.1, 'swoosh', -7); ev(TL.end + 0.35, 'sparkle', -7); ev(TL.end + 0.7, 'expand', -10);

// ------------------------------------------------------------------ frame
function seek(tReal) {
  const t = clamp(tReal, 0, DURATION) * DIL, b = t / BEAT;
  HALOS[0].img.style.transform = `rotate(${20 + t * 14}deg)`;
  const qOut = (k = 0) => E.inBack(segB(t, TL.explain - 0.5 + k * 0.08, TL.explain - 0.05 + k * 0.08, E.lin));

  // the question and the answers (in from frame 1)
  const qp = spB(t, -1.4, 1.9, 0.62);
  S(qCard, { transform: `scale(${lerp(0.3, 1, clamp(qp, 0, 1.1)) * (1 - qOut(0))})` }); show(qCard, qOut(0) < 1);
  opts.forEach((o, i) => {
    const pin = spB(t, -1.2 + i * 0.15, 2.2, 0.6);
    const k = F.out.indexOf(i), outB = k >= 0 ? TL.out[k] : null;
    const isOut = outB != null && b >= outB, isRight = i === F.right && b >= TL.reveal;
    const hit = outB != null ? spB(t, outB, 2.6, 0.4) : 0;
    const shake = outB != null && b >= outB && b < outB + 0.7 ? Math.sin((t - T(outB)) * 60) * 10 * (1 - (b - outB) / 0.7) : 0;
    const win = i === F.right ? spB(t, TL.reveal, 2.6, 0.45) : 0;
    const sc = lerp(0.3, 1, clamp(pin, 0, 1.1)) * (1 - 0.08 * clamp(hit)) * (1 + 0.06 * win - 0.06 * clamp(win - 1)) * (1 - qOut(i + 1));
    S(o.box, { transform: `translateX(${shake}px) scale(${sc})` }); show(o.box, qOut(i + 1) < 1);
    // flood from the letter: red for a knocked-out answer, green for the true one
    const f0 = isRight ? TL.reveal : outB;
    const fr = f0 != null ? lerp(0, 900, segB(t, f0, f0 + 0.55, E.outCubic)) : 0;
    S(o.fill, { clipPath: `circle(${fr.toFixed(1)}px at 56px 56px)` }); show(o.fill, fr > 0.5);
    const lit = isOut || isRight;
    S(o.label, { color: lit && fr > 140 ? C.white : C.forest });
    S(o.dot, { background: lit ? C.white : C.mint });
    const ms = f0 != null ? spB(t, f0 + 0.08, 3, 0.5) : 0;
    S(o.mark, { transform: `scale(${ms})` }); show(o.mark, ms > 0.001);
    S(o.letter, { transform: `scale(${1 - clamp(ms * 1.5)})` }); show(o.letter, ms < 0.66);
  });
  hint.set(segB(t, TL.hint, TL.hint + 0.45, E.outQuint), segB(t, TL.up - 0.1, TL.up + 0.2, E.inCubic));

  // countdown
  const drain = clamp((b - TL.n3) / (TL.up - TL.n3));
  const col = b < TL.n2 ? C.green : b < TL.n1 ? C.gold : C.red;
  arc.setAttribute('stroke', col); arc.setAttribute('stroke-dasharray', `${CIRC} ${CIRC}`); arc.setAttribute('stroke-dashoffset', (CIRC * drain).toFixed(1));
  let n = 3, prev = 3, rp = 1;
  if (b >= TL.n2) { n = 2; prev = 3; rp = E.outCubic(clamp((t - T(TL.n2)) / 0.14)); }
  if (b >= TL.n1) { n = 1; prev = 2; rp = E.outCubic(clamp((t - T(TL.n1)) / 0.14)); }
  numRoll.set(String(prev), String(n), rp);
  numRoll.box.querySelectorAll('span').forEach(s => { s.style.color = col; });
  let kick = 0; [TL.n3, TL.n2, TL.n1].forEach(nb => { const d = t - T(nb); if (d > 0 && d < 0.5) kick = Math.max(kick, Math.exp(-d * 9) * Math.sin(Math.min(d * 30, Math.PI))); });
  const tin = spB(t, TL.hint + 0.2, 2.4, 0.6);
  const mm = spB(t, TL.up, 2.4, 0.72);
  const tw = lerp(2 * TC.r, UPW, clamp(mm, 0, 1.1));
  const tOut = E.inBack(segB(t, TL.reveal - 0.1, TL.reveal + 0.25, E.lin));
  S(timer, { left: TC.cx - tw / 2, width: tw, background: mixc(C.white, C.red, clamp(mm * 2)), transform: `scale(${clamp(tin, 0, 1.1) * (1 + 0.1 * kick) * (1 - tOut)})` });
  show(timer, tin > 0.001 && tOut < 1);
  S(upTxt, { left: (tw - UPW) / 2 }); show(upTxt, mm > 0.05);
  show(numRoll.box, mm < 0.5);
  S(ring, { transform: `scale(${clamp(tin, 0, 1.1) * (1 + 0.1 * kick) * (1 - clamp(mm * 1.6))})` }); show(ring, tin > 0.001 && mm < 0.62);

  scene(t, b);

  // the pills: the open loop pays off at the bonus
  const sp = spB(t, -1.0, 2.2, 0.6), bp = spB(t, -0.8, 2.2, 0.6);
  const swap = segB(t, TL.bonus - 0.15, TL.bonus + 0.05, E.inCubic), bn = spB(t, TL.bonus + 0.05, 3, 0.45);
  const pillsOut = segB(t, TL.end - 0.3, TL.end, E.inBack);
  S(series, { transform: `scale(${clamp(sp, 0, 1.1) * (1 - pillsOut)})` }); show(series, pillsOut < 1);
  S(bonusPill, { transform: `scale(${clamp(bp, 0, 1.1) * (1 - swap) * (1 + 0.05 * Math.max(0, Math.sin(t * 7)) * (b > TL.explain ? 1 : 0))})` }); show(bonusPill, swap < 1);
  S(bonusNow, { transform: `scale(${bn * (1 - pillsOut)})` }); show(bonusNow, bn > 0.001 && pillsOut < 1);

  // Roviko: nervous, covers his eyes, peeks at each knock-out, shocked at the reveal, mind blown at the bonus
  {
    const covering = b >= TL.up && b < TL.reveal, peek = covering && ((b >= TL.out[0] && b < TL.out[0] + 0.7) || (b >= TL.out[1] && b < TL.out[1] + 0.7));
    const shock = b >= TL.reveal && b < TL.explain, blown = b >= TL.bonus + 0.2 && b < TL.bonus + 2.2, happy = b >= TL.cap3;
    const nerves = clamp((b - 1) / 6);
    let arms = [[-112, 64 - 8 * Math.sin(t * 9), 22, 10], [112, 64 + 8 * Math.sin(t * 9), 22, 10]], hop = 0;
    if (covering) arms = [[-34, -6, -30, 11], peek ? [104, 62, 22, 10] : [34, -6, -30, 11]];
    if (shock) arms = [[-92, -58, -30, 11], [92, -58, -30, 11]];
    if (blown) arms = [[-70, -96, -30, 11], [70, -96, -30, 11]];
    if (happy) { const wig = Math.sin(t * 13) * 6; arms = [[-118 + wig, -92, -22, 11], [118 - wig, -92, -22, 11]]; hop = bop(b, 12); }
    else if (b < TL.up) hop = bop(b, 5, 0.5);
    else if (b >= TL.explain && !blown) hop = bop(b, 4);
    const sh = spB(t, TL.reveal, 2.6, 0.5);
    drawMascot(mascot, { look: shock ? [0, 0] : covering ? [0.5, -0.6] : b >= TL.explain ? [0.8, -0.7] : [0.75, -0.9],
      mouth: shock || blown ? 'o' : covering ? 'wobble' : happy ? 'open' : b >= TL.explain ? 'grin' : 'smile',
      brows: !shock && b > 2 && b < TL.reveal ? 'worried' : shock ? 'up' : null, sweat: b < TL.reveal ? clamp((b - 4) / 1.5) : 0,
      eyesBig: shock ? sh * 0.6 : blown ? 0.6 : b < TL.reveal ? nerves * 0.35 : 0, blink: covering && !peek ? 1 : blinkAt(t, [2.2, 18.4, 26.8]),
      cheeks: happy ? 0.8 : 0, legs: 1, hop, arms, tilt: shock ? Math.sin((t - T(TL.reveal)) * 10) * 6 * Math.exp(-(t - T(TL.reveal)) * 2) : 0 });
  }
  what.set(spB(t, TL.wow, 2.4, 0.55), segB(t, TL.explain - 0.4, TL.explain - 0.05));

  cap1.set(spB(t, -1.5, 1.9, 0.62), segB(t, TL.explain - 0.45, TL.explain - 0.1));
  cap2.set(spB(t, TL.explain, 1.9, 0.62), segB(t, TL.bonus - 0.4, TL.bonus - 0.05));
  cap3.set(spB(t, TL.bonus, 1.9, 0.62), segB(t, TL.cap3 - 0.4, TL.cap3 - 0.05));
  cap4.set(spB(t, TL.cap3, 1.9, 0.62), segB(t, TL.end - 0.3, TL.end + 0.05));
  endCard.update(t, TL.end, [MX, MY], { hops: [TL.hop], blinks: [TL.blink2] });
}
boot(seek, DURATION);
</script>
