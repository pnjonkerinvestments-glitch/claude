name: Premarket alert (GitHub, handmatig)

# De geplande runs zijn verhuisd naar Cloudflare (zie worker/). Deze workflow is
# alleen nog een handmatige noodroute; zet hem niet weer op een schema zolang de
# Worker draait, anders krijg je elke melding twee keer.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Alleen printen, geen mail versturen"
        type: boolean
        default: false
      ignore_window:
        description: "Ook draaien buiten 04:00-09:30 ET"
        type: boolean
        default: true
      threshold:
        description: "Drempel in procenten"
        type: string
        default: "50"

concurrency:
  group: premarket-alert
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # De status onthoudt welke tickers vandaag al gemaild zijn.
      - name: Vorige status ophalen
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: premarket-state-placeholder
          restore-keys: premarket-state-

      - name: Scannen en mailen
        env:
          PROVIDER: ${{ vars.PROVIDER || 'tradingview' }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          THRESHOLD_PCT: ${{ inputs.threshold || vars.THRESHOLD_PCT || '50' }}
          MIN_PRICE: ${{ vars.MIN_PRICE || '1' }}
          MIN_PREMARKET_VOLUME: ${{ vars.MIN_PREMARKET_VOLUME || '50000' }}
          MIN_DOLLAR_VOLUME: ${{ vars.MIN_DOLLAR_VOLUME || '100000' }}
          EXCHANGES: ${{ vars.EXCHANGES || 'NASDAQ,NYSE,AMEX' }}
          RE_ALERT_STEP_PCT: ${{ vars.RE_ALERT_STEP_PCT || '25' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          DRY_RUN: ${{ inputs.dry_run }}
          IGNORE_WINDOW: ${{ inputs.ignore_window }}
        run: python -m premarket_alert

      - name: Status bewaren
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          # Cache-sleutels zijn onveranderlijk, dus elke run heeft een eigen sleutel;
          # restore-keys pakt bij de volgende run vanzelf de nieuwste.
          key: premarket-state-${{ github.run_id }}-${{ github.run_attempt }}
