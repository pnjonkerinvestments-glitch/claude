# Refreshes the World Bank snapshot (lib/data/comparisons.json) from the live WDI API and commits
# the result to the branch it ran on. Gameplay never calls the API: this only updates the checked-in data.
name: Roviko data refresh

on:
  workflow_dispatch:
  push:
    branches: [claude/upbeat-sagan-8igsaj]
    paths: [roviko/scripts/import-comparisons.py, .github/workflows/roviko-data.yml]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Import the newest World Bank indicators
        working-directory: roviko
        run: python3 scripts/import-comparisons.py
      - name: Commit the new snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add roviko/lib/data/comparisons.json roviko/public/data/comparisons.json roviko/public/data/sources.json
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Data: newest World Bank WDI year per indicator"
          git push
