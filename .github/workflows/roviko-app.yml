name: Roviko app

on:
  workflow_dispatch:
  push:
    paths:
      - "roviko-app/**"
      - ".github/workflows/roviko-app.yml"

defaults:
  run:
    working-directory: roviko-app

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ROVIKO_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: roviko-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Test build (APK to install on a phone)
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Signed release for Google Play (AAB)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE: ${{ secrets.ROVIKO_KEYSTORE_BASE64 }}
          ROVIKO_KEYSTORE_PASSWORD: ${{ secrets.ROVIKO_KEYSTORE_PASSWORD }}
          ROVIKO_KEY_ALIAS: ${{ secrets.ROVIKO_KEY_ALIAS }}
          ROVIKO_KEY_PASSWORD: ${{ secrets.ROVIKO_KEY_PASSWORD }}
          ROVIKO_VERSION_CODE: ${{ github.run_number }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          export ROVIKO_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          cd android && ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: roviko-android
          path: |
            roviko-app/android/app/build/outputs/apk/debug/*.apk
            roviko-app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: roviko-app/package-lock.json
      - run: npm ci
      - run: npx cap sync ios
      - name: Compile for the iOS simulator (no signing needed)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

  # Signed App Store build, uploaded straight to App Store Connect (TestFlight), without a Mac of your own.
  # Needs four repository secrets (Settings → Secrets and variables → Actions); see roviko-app/LANCERING.md.
  ios-release:
    # App Store Connect only accepts builds made with Xcode 26 (iOS 26 SDK) or later.
    runs-on: macos-26
    if: github.event_name == 'workflow_dispatch'
    env:
      HAS_KEY: ${{ secrets.APPSTORE_KEY_P8 != '' }}
    steps:
      - name: Check the App Store secrets
        if: env.HAS_KEY != 'true'
        run: |
          echo "::notice::No App Store key set up yet: skipping the signed iOS build. See roviko-app/LANCERING.md."
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - uses: maxim-lobanov/setup-xcode@v1
        if: env.HAS_KEY == 'true'
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        if: env.HAS_KEY == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: roviko-app/package-lock.json
      - if: env.HAS_KEY == 'true'
        run: npm ci
      - if: env.HAS_KEY == 'true'
        run: npx cap sync ios
      - name: Archive, sign and upload to App Store Connect
        if: env.HAS_KEY == 'true'
        env:
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"
          # Rebuild the .p8 in clean PEM form: pasting often loses line breaks or adds \r, quotes or spaces.
          # Also accepts the whole file base64-encoded. Never prints the key.
          KEY_PATH="$KEY_PATH" python3 - <<'PY'
          import base64, binascii, os, re, sys
          raw = os.environ['KEY_P8'].strip().strip('"\'')
          if not raw.startswith('-----') and raw.startswith('LS0t'):
              raw = base64.b64decode(re.sub(r'\s+', '', raw)).decode()
          body = re.sub(r'-----[A-Z ]+-----', '', raw.replace('\\n', '\n'))
          body = re.sub(r'[^A-Za-z0-9+/=]', '', body)
          try:
              der = base64.b64decode(body, validate=True)
          except (binascii.Error, ValueError):
              der = b''
          if not 100 <= len(der) <= 200:
              print('::error::APPSTORE_KEY_P8 is not a valid App Store Connect key. Paste the full contents of AuthKey_XXXXXXXXXX.p8, including the BEGIN and END lines.'); sys.exit(1)
          lines = [body[i:i + 64] for i in range(0, len(body), 64)]
          open(os.environ['KEY_PATH'], 'w').write('-----BEGIN PRIVATE KEY-----\n' + '\n'.join(lines) + '\n-----END PRIVATE KEY-----\n')
          PY
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Roviko.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            "${AUTH[@]}" archive
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Roviko.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          echo "::notice::Build $BUILD_NUMBER uploaded. It appears under TestFlight in App Store Connect within about 15 minutes."
          rm -f "$KEY_PATH"
