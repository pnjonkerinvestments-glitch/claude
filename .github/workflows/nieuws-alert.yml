name: Nieuwsmelder

# Test de nieuwsmelder (map nieuws/) bij elke push, controleert live of TradingView-nieuws
# goed binnenkomt, en zet hem op de standaardbranch live als Cloudflare Worker "nieuws-alert".
# Dat is een aparte Worker naast Roviko; hij raakt roviko.app niet.
#
# Nodig als repository secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  (dezelfde als voor Roviko; token heeft
#                                                 Workers Scripts: Edit en D1: Edit nodig)
#   TELEGRAM_BOT_TOKEN                           van @BotFather, zie nieuws/README.md
#   TELEGRAM_CHAT_ID                             optioneel; anders wordt wie als eerste /start stuurt de eigenaar

on:
  push:
    paths:
      - "nieuws/**"
      - ".github/workflows/nieuws-alert.yml"
  workflow_dispatch:

concurrency:
  group: nieuws-alert-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: nieuws

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nieuws/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Workernaam controleren
        # Nooit onder de naam van de live site deployen.
        run: |
          grep -q '"name": "nieuws-alert"' wrangler.jsonc
      - run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/dist"

  # Haalt echt nieuws op bij TradingView. Faalt als TradingView van formaat verandert.
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run probe -- XETR:1INN XETR:SAP
      - run: node scripts/explore.ts
        if: always()
        env:
          WORDS: '["IPO", "IPOs", "initial public offering", "intention to float", "first day of trading", "admission to trading", "debut", "flotation", "listing", "public listing", "begins trading", "go public", "stock market debut", "Börsengang", "Erstnotiz", "Börsendebüt", "Notierungsaufnahme", "Zeichnungsfrist", "Börsenneuling", "introduction en bourse", "première cotation", "cotation", "admission aux négociations", "quotazione", "debutto", "ammissione alle negoziazioni", "matricola", "salida a bolsa", "OPV", "debut bursátil", "estreno bursátil", "oferta pública inicial", "entrada em bolsa", "beursgang", "beursnotering", "börsnotering", "notering", "børsnotering", "listautumisanti", "listautuminen"]'

  deploy:
    needs: test
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nieuws/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Deployen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Zet de repository secrets CLOUDFLARE_API_TOKEN en CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::error::Zet de repository secret TELEGRAM_BOT_TOKEN (zie nieuws/README.md)"
            exit 1
          fi
          secrets_file="$RUNNER_TEMP/secrets.json"
          jq -n 'env | with_entries(select((.key | IN("TELEGRAM_BOT_TOKEN","TELEGRAM_CHAT_ID")) and .value != ""))' > "$secrets_file"
          echo "Secrets naar de Worker: $(jq -r 'keys | join(", ")' "$secrets_file")"
          npx wrangler deploy --secrets-file "$secrets_file"
          rm -f "$secrets_file"
