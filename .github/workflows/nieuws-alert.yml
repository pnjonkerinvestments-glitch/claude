name: Nieuwsmelder

# Test de nieuwsmelder (map nieuws/) bij elke push, controleert live of TradingView-nieuws
# goed binnenkomt, en zet hem op de standaardbranch live als Cloudflare Worker "nieuws-alert".
# Dat is een aparte Worker naast Roviko; hij raakt roviko.app niet.
#
# Nodig als repository secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  (dezelfde als voor Roviko; token heeft
#                                                 Workers Scripts: Edit en D1: Edit nodig)
#   TELEGRAM_BOT_TOKEN                           van @BotFather, zie nieuws/README.md
#   TELEGRAM_CHAT_ID                             optioneel; anders wordt wie als eerste /start stuurt de eigenaar

on:
  push:
    paths:
      - "nieuws/**"
      - ".github/workflows/nieuws-alert.yml"
  workflow_dispatch:

concurrency:
  group: nieuws-alert-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: nieuws

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nieuws/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Workernaam controleren
        # Nooit onder de naam van de live site deployen.
        run: |
          grep -q '"name": "nieuws-alert"' wrangler.jsonc
      - run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/dist"

  # Haalt echt nieuws op bij TradingView. Faalt als TradingView van formaat verandert.
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run probe -- XETR:1INN XETR:SAP
      - run: node scripts/explore.ts
        if: always()
      - name: Directors-dealings-pagina bekijken
        if: always()
        run: |
          for url in https://www.innoscripta.com/en-de/investors/investor-news/directors-dealings; do
            curl -sSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/130 Safari/537.36" -D "$RUNNER_TEMP/h.txt" -o "$RUNNER_TEMP/p.html" -w "HTTP %{http_code} %{size_download} bytes %{url_effective}\n" "$url" || true
            grep -iE "^(HTTP|content-type|location|server|x-powered|cf-)" "$RUNNER_TEMP/h.txt" | head -20
            echo "--- iframes / api / eqs / json / rss"
            grep -oiE '(<iframe[^>]*>|https?://[^"'"'"' )]*(eqs|cockpit|api|feed|rss|json|graphql|news)[^"'"'"' )]*|__NEXT_DATA__|/_next/data[^"'"'"']*|wp-json[^"'"'"']*)' "$RUNNER_TEMP/p.html" | sort -u | head -40
            echo "--- pdf-links"
            grep -oiE 'https?://[^"'"'"' ]+\.pdf' "$RUNNER_TEMP/p.html" | sort -u | head -15
            echo "--- tekst"
            sed -e 's/<script[^>]*>.*<\/script>//g' "$RUNNER_TEMP/p.html" | sed -e 's/<[^>]*>/ /g' | tr -s ' \n' ' ' | grep -oiE '.{0,300}(dealing|managers|Eigengesch|directors).{0,1500}' | head -c 4000
          done

  deploy:
    needs: test
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nieuws/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Deployen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Zet de repository secrets CLOUDFLARE_API_TOKEN en CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::error::Zet de repository secret TELEGRAM_BOT_TOKEN (zie nieuws/README.md)"
            exit 1
          fi
          secrets_file="$RUNNER_TEMP/secrets.json"
          jq -n 'env | with_entries(select((.key | IN("TELEGRAM_BOT_TOKEN","TELEGRAM_CHAT_ID")) and .value != ""))' > "$secrets_file"
          echo "Secrets naar de Worker: $(jq -r 'keys | join(", ")' "$secrets_file")"
          npx wrangler deploy --secrets-file "$secrets_file"
          rm -f "$secrets_file"
