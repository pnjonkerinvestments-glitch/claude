<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Roviko – geen verbinding</title>
<style>
  :root{color-scheme:light dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#fff;text-align:center;
    background:linear-gradient(125deg,#2f5bea,#6a4cf0 70%,#22a6f2 140%)}
  main{max-width:360px}
  img{width:150px;height:150px;animation:float 5s ease-in-out infinite}
  h1{font-size:1.8rem;margin:18px 0 8px}
  p{font-size:1.1rem;line-height:1.5;margin:0 0 26px;opacity:.95}
  button{font:inherit;font-weight:800;font-size:1.1rem;min-height:56px;padding:14px 28px;border:0;border-radius:18px;background:#ffc83d;color:#14213d;box-shadow:0 5px 0 #d99a00;cursor:pointer}
  button:active{transform:translateY(3px);box-shadow:0 2px 0 #d99a00}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @media (prefers-reduced-motion:reduce){img{animation:none}}
</style>
</head>
<body>
<main>
  <img src="mascot.png" alt="">
  <h1 id="t">Even geen internet</h1>
  <p id="c">Roviko heeft verbinding nodig om je puzzels op te halen. Check je wifi of mobiele data en probeer het opnieuw.</p>
  <button id="b" onclick="location.href='https://roviko.app/'">Opnieuw proberen</button>
</main>
<script>
  if (!/^nl\b/i.test(navigator.language || '')) {
    document.documentElement.lang = 'en';
    document.getElementById('t').textContent = 'No internet right now';
    document.getElementById('c').textContent = 'Roviko needs a connection to fetch your puzzles. Check your Wi-Fi or mobile data and try again.';
    document.getElementById('b').textContent = 'Try again';
  }
  window.addEventListener('online', () => location.href = 'https://roviko.app/');
</script>
</body>
</html>
