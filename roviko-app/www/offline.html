<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Roviko – geen verbinding</title>
<style>
  :root{color-scheme:light dark;--bg:#F6F3E9;--ink:#18211D;--soft:#4c5751;--btn:#1F806B;--btn-ink:#fff}
  @media (prefers-color-scheme:dark){:root{--bg:#163B32;--ink:#F6F3E9;--soft:#cfe0d8;--btn:#F6B84B;--btn-ink:#18211D}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);text-align:center;background:var(--bg)}
  main{max-width:360px}
  img{width:150px;height:150px;animation:float 5s ease-in-out infinite}
  h1{font-size:1.8rem;margin:18px 0 8px;letter-spacing:-.01em}
  p{font-size:1.1rem;line-height:1.5;margin:0 0 26px;color:var(--soft)}
  button{font:inherit;font-weight:800;font-size:1.1rem;min-height:56px;padding:14px 28px;border:0;border-radius:16px;background:var(--btn);color:var(--btn-ink);cursor:pointer}
  button:active{transform:translateY(2px)}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @media (prefers-reduced-motion:reduce){img{animation:none}}
</style>
</head>
<body>
<main>
  <img src="mascot.png" alt="">
  <h1 id="t">Even geen internet</h1>
  <p id="c">Roviko heeft verbinding nodig om je spellen op te halen. Check je wifi of mobiele data en probeer het opnieuw.</p>
  <button id="b" onclick="location.href='https://roviko.app/'">Opnieuw proberen</button>
</main>
<script>
  var l = (navigator.language || '').toLowerCase();
  if (/^es\b/.test(l)) {
    document.documentElement.lang = 'es';
    document.getElementById('t').textContent = 'Sin internet por ahora';
    document.getElementById('c').textContent = 'Roviko necesita conexión para cargar tus juegos. Revisa tu wifi o tus datos móviles y vuelve a intentarlo.';
    document.getElementById('b').textContent = 'Reintentar';
  } else if (!/^nl\b/.test(l)) {
    document.documentElement.lang = 'en';
    document.getElementById('t').textContent = 'No internet right now';
    document.getElementById('c').textContent = 'Roviko needs a connection to fetch your games. Check your Wi-Fi or mobile data and try again.';
    document.getElementById('b').textContent = 'Try again';
  }
  window.addEventListener('online', function () { location.href = 'https://roviko.app/'; });
</script>
</body>
</html>
