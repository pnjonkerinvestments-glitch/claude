# Market overview dashboard configuration.
# Thresholds, tickers and COT contracts live here. Restart the dashboard after editing.

server:
  host: 127.0.0.1        # use 0.0.0.0 to let colleagues connect; overridable with --host / DASHBOARD_HOST
  port: 8050             # overridable with --port / DASHBOARD_PORT

timezone: Europe/Amsterdam
database: data/dashboard.sqlite

# ---------------------------------------------------------------------------
# Refresh schedule (times in Europe/Amsterdam)
# ---------------------------------------------------------------------------
refresh:
  daily_times: ["18:00", "22:30"]   # prices, breadth, ratios, FRED, CBOE
  daily_days: mon-fri
  cot_time: "22:00"                 # CFTC publishes Friday 15:30 ET
  cot_day: fri

# ---------------------------------------------------------------------------
# Summary: market regime tally. Every indicator scores green +1, orange 0, red -1.
# ---------------------------------------------------------------------------
regime:
  trend:
    # Number of moving averages (20, 50, 200 day) the index closes above.
    moving_averages: [20, 50, 200]
    green_min_above: 3      # above all three -> green
    orange_min_above: 1     # above 1 or 2 -> orange, above none -> red
    indices: [SPX, NDX, RUT, SX5E]

  breadth:
    # % of index members above their 50- and 200-day average.
    green_min_pct: 60       # both >= 60% -> green
    red_max_pct: 40         # both <= 40% -> red, otherwise orange

  vix_level:
    green_below: 18
    red_above: 25

  vix_term_structure:
    # Ratio VIX / VIX3M. Below 1 = contango (normal), at or above 1 = backwardation (stress).
    green_below: 0.95
    red_above: 1.00

  put_call:
    # Percentile of the 5-day average CBOE equity put/call ratio within the last year.
    average_days: 5
    lookback_days: 252
    green_below_pct: 60
    red_above_pct: 85

  credit:
    # ICE BofA US High Yield OAS, in percent; change over 20 observations in basis points.
    change_days: 20
    green_max_level: 4.0
    green_max_change_bp: 0
    red_min_level: 5.0
    red_min_change_bp: 50

  yield_curve:
    # 10Y minus 2Y in percentage points.
    green_above: 0.50
    red_below: 0.00

  verdict:
    # score = (#green - #red) / #indicators with data, in percent.
    risk_on_min_pct: 33
    risk_off_max_pct: -33

# ---------------------------------------------------------------------------
# Signals: extremes listed at the top of the page
# ---------------------------------------------------------------------------
signals:
  rsi_oversold: 30
  rsi_overbought: 70
  rsi_watch: [SPY, QQQ, SMH, IWM, RSP, "^STOXX", GLD, GDX, IBIT]
  cot_extreme_low: 10       # net/OI percentile (all-time) at or below -> flagged
  cot_extreme_high: 90
  streak_alert_days: 40     # S&P days without a 1% decline
  breadth_outperform_low: 30
  breadth_outperform_high: 65
  weekly_drop_pct: -5       # Nasdaq-100 weekly loss at or below -> flagged

# ---------------------------------------------------------------------------
# Prices (Yahoo Finance). tv = TradingView symbol for the "open in TradingView" link.
# ---------------------------------------------------------------------------
prices:
  history_period: 2y        # first start; enough for 200-day averages and 1-year charts
  long_history_period: max  # for the tickers in long_history (multi-year charts)
  update_period: 1mo
  long_history: ["^GSPC", "^NDX", RSP, SPY, "DX-Y.NYB", "EURUSD=X", "GC=F", "^VIX", "^MOVE", "BTC-USD", "ETH-USD"]

  indices:
    SPX:   {ticker: "^GSPC",     name: "S&P 500",       tv: "SP:SPX"}
    NDX:   {ticker: "^NDX",      name: "Nasdaq-100",    tv: "NASDAQ:NDX"}
    RUT:   {ticker: "^RUT",      name: "Russell 2000",  tv: "TVC:RUT"}
    SX5E:  {ticker: "^STOXX50E", name: "Euro Stoxx 50", tv: "TVC:SX5E"}
    SXXP:  {ticker: "^STOXX",    name: "STOXX 600",     tv: "TVC:SXXP"}
    DAX:   {ticker: "^GDAXI",    name: "DAX",           tv: "XETR:DAX"}
    AEX:   {ticker: "^AEX",      name: "AEX",           tv: "EURONEXT:AEX"}

