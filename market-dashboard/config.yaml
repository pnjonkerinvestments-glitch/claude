      - [QQQ, "Nasdaq-100"]
      - [RSP, "Equal-weight S&P"]
      - [DIA, "Dow"]
      - [IWM, "Russell 2000"]
      - [MDY, "Mid-cap 400"]
      - [XLK, "Technology"]
      - [XLC, "Comm services"]
      - [XLY, "Discretionary"]
      - [XLF, "Financials"]
      - [XLV, "Health care"]
      - [XLI, "Industrials"]
      - [XLE, "Energy"]
      - [XLB, "Materials"]
      - [XLP, "Staples"]
      - [XLU, "Utilities"]
      - [XLRE, "Real estate"]
      - [SMH, "Semiconductors"]
      - [IGV, "Software"]
      - [CIBR, "Cybersecurity"]
      - [MAGS, "Magnificent 7"]
      - [ARKK, "Innovation (ARKK)"]
      - [KRE, "Regional banks"]
      - [XOP, "Oil & gas E&P"]
      - [ITB, "Homebuilders"]
      - [XRT, "Retail"]
      - [SPLV, "Low volatility"]
      - [QUAL, "Quality"]
      - [VTV, "Value"]
      - [URA, "Uranium"]
      - [COPX, "Copper miners"]
      - [GDX, "Gold miners"]
      - [EFA, "Developed ex-US"]
      - [EWZ, "Brazil"]
      - [FXI, "China large-cap"]
      - [EWY, "South Korea"]

  # STOXX Europe 600 sector ETFs (iShares, Xetra). Benchmark: STOXX 600.
  eu_etfs:
    benchmark: "^STOXX"
    items:
      - ["EXV1.DE", "Banks"]
      - ["EXH2.DE", "Financial services"]
      - ["EXH5.DE", "Insurance"]
      - ["EXV3.DE", "Technology"]
      - ["EXV4.DE", "Health care"]
      - ["EXH1.DE", "Oil & gas"]
      - ["EXH9.DE", "Utilities"]
      - ["EXV6.DE", "Basic resources"]
      - ["EXV7.DE", "Chemicals"]
      - ["EXH4.DE", "Industrials"]
      - ["EXV8.DE", "Construction"]
      - ["EXV5.DE", "Autos"]
      - ["EXH3.DE", "Food & beverage"]
      - ["EXH7.DE", "Personal & household"]
      - ["EXH8.DE", "Retail"]
      - ["EXV9.DE", "Travel & leisure"]
      - ["EXH6.DE", "Media"]
      - ["EXV2.DE", "Telecom"]
      - ["EXI5.DE", "Real estate"]

  # Chart-and-table groups further down the page.
  commodities:
    - {ticker: "GC=F", name: "Gold",        tv: "COMEX:GC1!", cot: gold}
    - {ticker: "SI=F", name: "Silver",      tv: "COMEX:SI1!", cot: silver}
    - {ticker: GDX,    name: "Gold miners", tv: GDX}
    - {ticker: "HG=F", name: "Copper",      tv: "COMEX:HG1!", cot: copper}
    - {ticker: "CL=F", name: "WTI crude",   tv: "NYMEX:CL1!", cot: wti}
    - {ticker: "RB=F", name: "Gasoline",    tv: "NYMEX:RB1!", cot: gasoline}
    - {ticker: "NG=F", name: "Natural gas", tv: "NYMEX:NG1!", cot: natgas}
  crypto:
    - {ticker: "BTC-USD", name: "Bitcoin",  tv: "BITSTAMP:BTCUSD", cot: bitcoin}
    - {ticker: "ETH-USD", name: "Ether",    tv: "COINBASE:ETHUSD", cot: ether}
    - {ticker: IBIT,      name: "IBIT (spot BTC ETF)", tv: IBIT}
  asia:
    - {ticker: "^KS11", name: "KOSPI",       tv: "KRX:KOSPI"}
    - {ticker: "^N225", name: "Nikkei 225",  tv: "TVC:NI225"}
    - {ticker: EWY,     name: "EWY (Korea ETF)", tv: EWY}
    - {ticker: FXI,     name: "FXI (China large-cap)", tv: FXI}
  dollar:
    - {ticker: "DX-Y.NYB", name: "Dollar index (DXY)", tv: "TVC:DXY", cot: usd}
    - {ticker: "EURUSD=X", name: "EUR/USD",            tv: "FX:EURUSD", cot: eur}
    - {ticker: "JPY=X",    name: "USD/JPY",            tv: "FX:USDJPY", cot: jpy}
  rates_futures:
    - {ticker: "ZN=F", name: "10Y T-Note futures (TY)", tv: "CBOT:ZN1!"}
  volatility:
    move: "^MOVE"

  # Risk-appetite ratios
  ratios:
    HYG_IEF:     {numerator: HYG,    denominator: IEF,    name: "HYG / IEF (credit vs Treasuries)"}
    RSP_SPY:     {numerator: RSP,    denominator: SPY,    name: "RSP / SPY (equal vs cap weight)"}
    SMH_SPY:     {numerator: SMH,    denominator: SPY,    name: "SMH / SPY (semis vs market)"}
    XLY_XLP:     {numerator: XLY,    denominator: XLP,    name: "XLY / XLP (discretionary vs staples)"}
  ratio_ma_days: 50
  ratio_chart_days: 252

# Index members used for breadth (Yahoo tickers). S&P 500 list: dashboard/universe/sp500.csv.
# European lists checked against Wikipedia constituent tables, Oct 2026. Membership changes at
# index reviews (quarterly for DAX/AEX, September for Euro Stoxx 50); update the lists then.
breadth_components:
  SX5E: [ABI.BR, AD.AS, ADS.DE, ADYEN.AS, AI.PA, AIR.PA, ALV.DE, ARGX.BR, ASML.AS, BAS.DE,
         BAYN.DE, BBVA.MC, BMW.DE, BN.PA, BNP.PA, CS.PA, DB1.DE, DBK.DE, DG.PA, DHL.DE,
         DTE.DE, EL.PA, ENEL.MI, ENI.MI, ENR.DE, IBE.MC, IFX.DE, INGA.AS, ISP.MI, ITX.MC,
         MBG.DE, MC.PA, MUV2.DE, NDA-FI.HE, OR.PA, PRX.AS, RACE.MI, RHM.DE, RMS.PA, SAF.PA,
         SAN.MC, SAN.PA, SAP.DE, SGO.PA, SIE.DE, SU.PA, TTE.PA, UCG.MI, VOW3.DE, WKL.AS]
  DAX:  [ADS.DE, AIR.DE, ALV.DE, BAS.DE, BAYN.DE, BEI.DE, BMW.DE, BNR.DE, CBK.DE, CON.DE,
         DB1.DE, DBK.DE, DHL.DE, DTE.DE, DTG.DE, ENR.DE, EOAN.DE, FME.DE, FRE.DE, G1A.DE,
         HEI.DE, HEN3.DE, HNR1.DE, IFX.DE, MBG.DE, MRK.DE, MTX.DE, MUV2.DE, PAH3.DE, QIA.DE,
         RHM.DE, RWE.DE, SAP.DE, SHL.DE, SIE.DE, G24.DE, SY1.DE, VNA.DE, VOW3.DE, ZAL.DE]
  AEX:  [ABN.AS, AD.AS, ADYEN.AS, AGN.AS, AKZA.AS, ASM.AS, ASML.AS, ASRNL.AS, BESI.AS, DSFIR.AS,
         EXO.AS, HEIA.AS, IMCD.AS, INGA.AS, KPN.AS, MT.AS, NN.AS, PHIA.AS, PRX.AS,
         RAND.AS, REN.AS, SHELL.AS, UMG.AS, UNA.AS, WKL.AS]

breadth:
  outperform_days: 42       # "% of stocks outperforming the index" over ~2 months
  chart_days: 504           # 2 years
  mcclellan_fast: 19
  mcclellan_slow: 39

cboe:
  # Falls back to Yahoo (^VIX, ^VIX9D, ^VIX3M) when CBOE cannot be reached.
  index_history_url: "https://cdn.cboe.com/api/global/us_indices/daily_prices/{symbol}_History.csv"
  vix_symbols: [VIX9D, VIX, VIX3M]
  put_call_url: "https://cdn.cboe.com/data/us/options/market_statistics/daily/{date}_daily_options"
  put_call_history_days: 1100  # calendar days fetched on first start (3 years)
  etf_put_call: [SPY, QQQ, IWM]   # Yahoo option chains; history builds up from the first evening run
  chart_days: 126              # about 6 months

fred:
  api_url: "https://api.stlouisfed.org/fred/series/observations"   # used with FRED_API_KEY
  csv_url: "https://fred.stlouisfed.org/graph/fredgraph.csv"        # keyless fallback
  history_days: 1200
  sparkline_days: 63
  series:
    DGS2:         {name: "US 2Y",  tv: "TVC:US02Y"}
    DGS5:         {name: "US 5Y",  tv: "TVC:US05Y"}
    DGS10:        {name: "US 10Y", tv: "TVC:US10Y"}
    DGS30:        {name: "US 30Y", tv: "TVC:US30Y"}
    T10Y2Y:       {name: "2s10s spread", tv: "TVC:US10Y-TVC:US02Y"}
    DFII10:       {name: "US 10Y real yield", tv: "FRED:DFII10"}
    BAMLH0A0HYM2: {name: "High-yield spread (OAS)", tv: "FRED:BAMLH0A0HYM2"}

# ---------------------------------------------------------------------------
# COT (CFTC). tff = Traders in Financial Futures, disagg = Disaggregated, both futures only.
# cohort: am = asset managers, lf = leveraged funds, mm = managed money.
# ---------------------------------------------------------------------------
cftc:
  datasets:
    tff:    "https://publicreporting.cftc.gov/resource/gpe5-46if.json"
    disagg: "https://publicreporting.cftc.gov/resource/72hh-3qpy.json"
  history_start: "2006-01-01"
  index_view:                        # the positioning chart at the top, in this order
    indices: [spx, ndx, rut, dow]
    commodities: [gold, silver, copper, wti, gasoline, natgas]
  assets:
    - {key: spx,      label: "S&P 500",      group: "Equity indices", dataset: tff,    code: "13874A", cohort: am, price: "^GSPC"}
    - {key: ndx,      label: "Nasdaq-100",   group: "Equity indices", dataset: tff,    code: "209742", cohort: am, price: "^NDX"}
    - {key: dow,      label: "Dow",          group: "Equity indices", dataset: tff,    code: "124603", cohort: am, price: "DIA"}
    - {key: rut,      label: "Russell 2000", group: "Equity indices", dataset: tff,    code: "239742", cohort: lf, price: "^RUT"}
    - {key: vix,      label: "VIX",          group: "Volatility",     dataset: tff,    code: "1170E1", cohort: am, price: "^VIX"}
    - {key: tu,       label: "2Y note (TU)", group: "Rates",          dataset: tff,    code: "042601", cohort: lf, price: "ZT=F"}
    - {key: fv,       label: "5Y note (FV)", group: "Rates",          dataset: tff,    code: "044601", cohort: lf, price: "ZF=F"}
    - {key: ty,       label: "10Y note (TY)", group: "Rates",         dataset: tff,    code: "043602", cohort: lf, price: "ZN=F"}
    - {key: uxy,      label: "Ultra 10Y",    group: "Rates",          dataset: tff,    code: "043607", cohort: lf, price: "TN=F"}
    - {key: us,       label: "Bond (US)",    group: "Rates",          dataset: tff,    code: "020601", cohort: lf, price: "ZB=F"}
    - {key: sofr,     label: "SOFR 3M",      group: "Rates",          dataset: tff,    code: "134741", cohort: lf, price: null}
    - {key: usd,      label: "Dollar index", group: "FX",             dataset: tff,    code: "098662", cohort: lf, price: "DX-Y.NYB"}
    - {key: eur,      label: "Euro",         group: "FX",             dataset: tff,    code: "099741", cohort: lf, price: "EURUSD=X"}
    - {key: jpy,      label: "Yen",          group: "FX",             dataset: tff,    code: "097741", cohort: lf, price: "6J=F"}
    - {key: gold,     label: "Gold",         group: "Metals",         dataset: disagg, code: "088691", cohort: mm, price: "GC=F"}
    - {key: silver,   label: "Silver",       group: "Metals",         dataset: disagg, code: "084691", cohort: mm, price: "SI=F"}
    - {key: copper,   label: "Copper",       group: "Metals",         dataset: disagg, code: "085692", cohort: mm, price: "HG=F"}
    - {key: wti,      label: "WTI crude",    group: "Energy",         dataset: disagg, code: "067651", cohort: mm, price: "CL=F"}
    - {key: gasoline, label: "Gasoline",     group: "Energy",         dataset: disagg, code: "111659", cohort: mm, price: "RB=F"}
    - {key: natgas,   label: "Natural gas",  group: "Energy",         dataset: disagg, code: "023651", cohort: mm, price: "NG=F"}
    - {key: bitcoin,  label: "Bitcoin",      group: "Crypto",         dataset: tff,    code: "133741", cohort: lf, price: "BTC-USD"}
    - {key: ether,    label: "Ether",        group: "Crypto",         dataset: tff,    code: "146021", cohort: lf, price: "ETH-USD"}

# ---------------------------------------------------------------------------
# Earnings: upcoming US reports with their European peers
# ---------------------------------------------------------------------------
earnings:
  min_market_cap: 1500000000  # USD (1.5 billion)
  correlation_weeks: 52       # weekly returns, so different closing times do not matter
  use_extra_peers: false      # true = also show the suggested pairs under extra_peers
  # Peer list: dashboard/universe/eu_peers.yaml

# ---------------------------------------------------------------------------
# Crypto volatility compression (90-day realized vol and 180-day range, both as percentiles)
# ---------------------------------------------------------------------------
crypto:
  rv_days: 90
  range_days: 180
  compression_pct: 20

